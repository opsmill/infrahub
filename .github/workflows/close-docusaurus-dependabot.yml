---
# yamllint disable rule:truthy rule:line-length
name: Close Docusaurus Dependabot PRs

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  check-and-close:
    permissions:
      pull-requests: write
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@v2
        id: metadata
        with:
          github-token: ${{ github.token }}

      - name: Close if Docusaurus package
        if: contains(steps.metadata.outputs.dependency-names, '@docusaurus/')
        run: |
          gh pr close "$PR_NUMBER" \
            --comment "Closed: Docusaurus updates are managed via the coordinated update process. See opsmill-skills/docusaurus/version.json."
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
