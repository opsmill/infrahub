---
# yamllint disable rule:truthy
name: Publish Infrahub-Server, Infrahub-Testcontainers Packages
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string
      publish:
        type: boolean
        description: Whether to publish the package to Pypi
        required: false
        default: false
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string
      publish:
        type: boolean
        description: Whether to publish the package to Pypi
        required: false
        default: false

jobs:
  prepare-environment:
    uses: ./.github/workflows/define-versions.yml
  publish_to_pypi:
    name: "Publish Infrahub-Server and Infrahub-Testcontainers to PyPI"
    runs-on: "ubuntu-22.04"
    strategy:
      matrix:
        package_dir: ["", "python_testcontainers"]
    needs: prepare-environment
    steps:
      - name: "Install libldap2-dev and libsasl2-dev"
        run: "sudo apt-get -y update && sudo apt-get -y install libldap2-dev libsasl2-dev"

      - name: "Set up Python"
        id: python
        uses: "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97" # v7.0.0
        with:
          python-version: ${{ needs.prepare-environment.outputs.PYTHON_VERSION }}

      - name: "Check out repository code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          submodules: true
          # Full history + tags so hatch-vcs stamps the real tag version, not the fallback
          fetch-depth: 0
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ needs.prepare-environment.outputs.UV_VERSION }}
      - name: Install Dependencies
        run: uv sync --all-groups --all-extras
      - name: "Build package"
        run: "uv build"
        working-directory: ${{ matrix.package_dir }}
      - name: "show output"
        run: "ls -la dist/"
        working-directory: ${{ matrix.package_dir }}
      - name: "Publish to PyPI"
        if: ${{ inputs.publish }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: "uv publish"
        working-directory: ${{ matrix.package_dir }}
