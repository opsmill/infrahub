---
# yamllint disable rule:truthy
name: Publish Infrahub-Server, Infrahub-Testcontainers Packages
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string
      publish:
        type: boolean
        description: Whether to publish the package to Pypi
        required: false
        default: false
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string
      publish:
        type: boolean
        description: Whether to publish the package to Pypi
        required: false
        default: false
    secrets:
      PYPI_TOKEN:
        description: PyPI API token (temporary, will be replaced by OIDC Trusted Publishing)
        required: false

permissions: {}

jobs:
  prepare-environment:
    permissions:
      contents: read
    uses: ./.github/workflows/define-versions.yml
  publish_to_pypi:
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: "Publish Infrahub-Server and Infrahub-Testcontainers to PyPI"
    runs-on: "ubuntu-22.04"
    strategy:
      matrix:
        package_dir: ["", "python_testcontainers"]
    needs: prepare-environment
    steps:
      - name: "Set up Python"
        id: python
        uses: "actions/setup-python@v6"
        with:
          python-version: ${{ needs.prepare-environment.outputs.PYTHON_VERSION }}

      - name: "Check out repository code"
        uses: "actions/checkout@v6"
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ needs.prepare-environment.outputs.UV_VERSION }}
      - name: Install Dependencies
        run: uv sync --all-groups --all-extras
      - name: "Build package"
        run: "uv build"
        working-directory: ${{ matrix.package_dir }}
      - name: "show output"
        run: "ls -la dist/"
        working-directory: ${{ matrix.package_dir }}
      - name: "Publish to PyPI"
        if: ${{ inputs.publish }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: "uv publish"
        working-directory: ${{ matrix.package_dir }}
