---
# yamllint disable rule:truthy rule:line-length
name: Trigger Infrahub update in other repositories

on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string
      version:
        type: string
        required: false
        description: The string to extract semver from.
        default: ''
  workflow_call:
    inputs:
      runs-on:
        description: "The OS to run the job on"
        required: false
        default: "ubuntu-22.04"
        type: string
      version:
        type: string
        required: false
        description: The string to extract semver from.
        default: ''
    secrets:
      GH_UPDATE_PACKAGE_OTTO:
        description: PAT for cross-repo repository dispatch
        required: true
      INFRAHUB_PACKER_REPOSITORY:
        description: Packer repository name
        required: false
      INFRAHUB_ENTERPRISE_REPOSITORY:
        description: Enterprise repository name
        required: false
      INFRAHUB_CUSTOMER1_REPOSITORY:
        description: Customer 1 repository name
        required: false
      INFRAHUB_CUSTOMER3_REPOSITORY:
        description: Customer 3 repository name
        required: false

permissions: {}

jobs:
  repository-dispatch:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # Either a literal path, or the name of a secret...
        repo:
          - "opsmill/infrahub-demo-dc"
          - "INFRAHUB_PACKER_REPOSITORY"
          - "INFRAHUB_ENTERPRISE_REPOSITORY"
          - "INFRAHUB_CUSTOMER1_REPOSITORY"
          - "INFRAHUB_CUSTOMER3_REPOSITORY"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GH_UPDATE_PACKAGE_OTTO }}
          # if matrix.repo contains a slash, use it literally; otherwise look up the secret named by matrix.repo
          repository: ${{ contains(matrix.repo, '/') && matrix.repo || secrets[matrix.repo] }}
          event-type: trigger-infrahub-update
          client-payload: |
            {"version":"${{ inputs.version }}"}
