---
# yamllint disable rule:truthy rule:line-length
name: Upgrade agentic workflows

# Regenerates the gh-aw agentic workflows (.github/workflows/*.md) with the
# newest gh-aw release, which also pins the newest Claude Code release that gh-aw
# supports, and opens a pull request for a person to review.
# See dev/knowledge/agentic-workflows.md.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upgrade-agentic-workflows
  cancel-in-progress: false

env:
  BASE_BRANCH: stable
  BRANCH_NAME: ci/upgrade-agentic-workflows
  BOT_NAME: opsmill-bot
  BOT_EMAIL: github-bot@opsmill.com

jobs:
  # The newly downloaded gh-aw runs here, so no step in this job holds a token that can write.
  upgrade:
    if: github.repository == 'opsmill/infrahub'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.describe.outputs.changed }}
      title: ${{ steps.describe.outputs.title }}
      base-sha: ${{ steps.describe.outputs.base-sha }}
      upgrade-sha: ${{ steps.describe.outputs.upgrade-sha }}
    steps:
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: Install the newest gh-aw release
        uses: github/gh-aw-actions/setup-cli@221ba4f4319de6b8e809d1a15528b3ae6a818aa5 # v1.0.1
        with:
          version: latest

      - name: Regenerate the agentic workflows
        env:
          GH_TOKEN: ${{ github.token }}
        # --approve accepts new secrets and actions; the pull request body lists them for the reviewer.
        run: gh aw upgrade --approve

      - name: Commit the changes and write the pull request body
        id: describe
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::The agentic workflows are already generated with the newest gh-aw release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          lock_headers() {
            for file in .github/workflows/*.lock.yml; do
              if [ "$1" = HEAD ]; then
                git show "HEAD:$file" 2>/dev/null || true
              else
                cat "$file"
              fi | sed -n "s/^# $2: //p"
            done
          }
          versions() {
            lock_headers "$1" gh-aw-metadata | jq -rs '
              "gh-aw " + ([.[] | .compiler_version] | unique | join(", ")) +
              "; Claude Code " + ([.[] | .engine_versions.claude // "unknown"] | unique | join(", "))'
          }
          added() {
            jq -rn \
              --argjson before "$(lock_headers HEAD gh-aw-manifest | jq -s "[.[].$1[]?$2] | unique")" \
              --argjson after "$(lock_headers worktree gh-aw-manifest | jq -s "[.[].$1[]?$2] | unique")" \
              '($after - $before) | if length == 0 then "none" else map("`" + . + "`") | join(", ") end'
          }

          # A header line that a new gh-aw release renamed would otherwise make every list below read "none".
          LOCK_FILES=$(find .github/workflows -maxdepth 1 -name '*.lock.yml' | wc -l)
          for header in gh-aw-metadata gh-aw-manifest; do
            if [ "$(lock_headers worktree "$header" | wc -l)" -ne "$LOCK_FILES" ]; then
              echo "::error::Not every lock file has a '# $header:' line. Update this workflow to the lock file format of the new gh-aw release."
              exit 1
            fi
          done

          GH_AW_VERSION=$(lock_headers worktree gh-aw-metadata | jq -rs '[.[] | .compiler_version] | unique | join(", ")')
          BEFORE=$(versions HEAD)
          AFTER=$(versions worktree)
          NEW_SECRETS=$(added secrets "")
          NEW_ACTIONS=$(added actions .repo)
          TITLE="ci: upgrade agentic workflows to gh-aw $GH_AW_VERSION"

          mkdir -p "$RUNNER_TEMP/upgrade"
          cat > "$RUNNER_TEMP/upgrade/pr-body.md" <<EOF
          Regenerates the agentic workflows with the newest gh-aw release.

          - Before: $BEFORE
          - After: $AFTER
          - New secrets the workflows read: $NEW_SECRETS
          - New actions the workflows use: $NEW_ACTIONS

          gh-aw skips some secrets when they are not set. For each new secret, check in the gh-aw documentation whether the workflows need it: a required secret that is missing makes them fail.

          Before merging, follow [Review an upgrade pull request](https://github.com/$REPOSITORY/blob/$BASE_BRANCH/dev/guides/updating-agentic-workflows.md#review-an-upgrade-pull-request).

          Opened by the [Upgrade agentic workflows]($RUN_URL) run.
          EOF

          BASE_SHA=$(git rev-parse HEAD)
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add --all
          git commit --quiet --message "$TITLE"
          git bundle create "$RUNNER_TEMP/upgrade/upgrade.bundle" "$BASE_SHA..HEAD"

          {
            echo "changed=true"
            echo "title=$TITLE"
            echo "base-sha=$BASE_SHA"
            echo "upgrade-sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the upgrade commit
        if: steps.describe.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentic-workflows-upgrade
          path: ${{ runner.temp }}/upgrade/
          if-no-files-found: error
          retention-days: 7

  # Runs on a fresh runner that never ran gh-aw, so nothing gh-aw left behind can reach the write token.
  publish:
    needs: upgrade
    if: needs.upgrade.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.upgrade.outputs.base-sha }}
          persist-credentials: false

      - name: Download the upgrade commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agentic-workflows-upgrade
          path: ${{ runner.temp }}/upgrade

      - name: Load the upgrade commit
        env:
          UPGRADE_SHA: ${{ needs.upgrade.outputs.upgrade-sha }}
        run: |
          set -euo pipefail
          git bundle verify --quiet "$RUNNER_TEMP/upgrade/upgrade.bundle"
          git fetch --quiet "$RUNNER_TEMP/upgrade/upgrade.bundle" HEAD
          if [ "$(git rev-parse FETCH_HEAD)" != "$UPGRADE_SHA" ]; then
            echo "::error::The downloaded commit is not the one the upgrade job created."
            exit 1
          fi

      - name: Create a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_AW_APP_ID }}
          private-key: ${{ secrets.GH_AW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Open or refresh the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TITLE: ${{ needs.upgrade.outputs.title }}
          UPGRADE_SHA: ${{ needs.upgrade.outputs.upgrade-sha }}
        run: |
          set -euo pipefail

          note() {
            echo "::notice::$1"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
          }
          patch_id() {
            git diff-tree --patch "$1" | git patch-id --stable | cut -d' ' -f1
          }

          # Every check below applies to this commit; an empty value means the branch does not exist yet.
          REMOTE_HEAD=$(git ls-remote origin "refs/heads/$BRANCH_NAME" | cut -f1)
          # A fork can open a pull request from a branch with the same name.
          OPEN_PR=$(gh pr list --repo "$REPOSITORY" --head "$BRANCH_NAME" --base "$BASE_BRANCH" \
            --state open --json number,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].number // empty')

          if [ -n "$OPEN_PR" ]; then
            # The parent commit is needed to compare the changes of the open pull request.
            git fetch --quiet --depth=2 origin "refs/heads/$BRANCH_NAME"
            if [ "$(git rev-parse FETCH_HEAD)" != "$REMOTE_HEAD" ]; then
              note "The branch of pull request #$OPEN_PR changed during this run, so it is left as it is."
              exit 0
            fi
            COMMITS=$(gh pr view "$OPEN_PR" --repo "$REPOSITORY" --json commits --jq '.commits | length')
            # Amending keeps the original author but not the committer, so the committer shows a person's edit.
            if [ "$COMMITS" != "1" ] || [ "$(git log -1 --format=%ce "$REMOTE_HEAD")" != "$BOT_EMAIL" ]; then
              note "Pull request #$OPEN_PR has changes from someone other than the bot, so it is left as it is. Close it to get a fresh one next week."
              exit 0
            fi
            MERGEABLE=$(gh pr view "$OPEN_PR" --repo "$REPOSITORY" --json mergeable --jq '.mergeable')
            if [ "$(patch_id "$REMOTE_HEAD")" = "$(patch_id "$UPGRADE_SHA")" ] && [ "$MERGEABLE" != "CONFLICTING" ]; then
              note "Pull request #$OPEN_PR already holds these changes."
              exit 0
            fi
          fi

          gh auth setup-git
          # Someone may push to the branch between the checks above and this push.
          git push "--force-with-lease=refs/heads/$BRANCH_NAME:$REMOTE_HEAD" origin "$UPGRADE_SHA:refs/heads/$BRANCH_NAME"

          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --repo "$REPOSITORY" --title "$TITLE" --body-file "$RUNNER_TEMP/upgrade/pr-body.md"
          else
            gh pr create --repo "$REPOSITORY" --base "$BASE_BRANCH" --head "$BRANCH_NAME" \
              --title "$TITLE" --body-file "$RUNNER_TEMP/upgrade/pr-body.md" \
              --label type/housekeeping --label ci/skip-changelog --label group/ci
          fi
