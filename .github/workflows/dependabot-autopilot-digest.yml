---
# yamllint disable rule:truthy rule:line-length
# Posts one weekly message to #release-radar listing the High and Medium tech-debt
# items the dependabot autopilot filed or updated in the last 7 days; posts nothing
# in a week without any.
name: dependabot-autopilot-digest
on:
  schedule:
    - cron: "30 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-autopilot-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Post the digest to the release-radar channel
        working-directory: .github/scripts
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_RELEASE_RADAR_WEBHOOK_URL: ${{ secrets.SLACK_RELEASE_RADAR_WEBHOOK_URL }}
        run: uv run --no-project --python 3.14 --with "pyyaml>=6,<7" python -m dependabot_autopilot digest
