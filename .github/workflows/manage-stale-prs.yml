---
# yamllint disable rule:truthy
name: "Manage Stale Pull Requests"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: manage-stale-prs
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  preview:
    if: github.repository == 'opsmill/infrahub'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stable
          persist-credentials: false
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        with:
          script: |
            const { run } = require('./.github/scripts/pr-lifecycle.cjs');
            const result = await run({ github, ...context.repo });
            await core.summary.addRaw(result.body).write();

  publish:
    # Activation requires a reviewed change and isolated hosted validation.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stable
          persist-credentials: false
      - uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          DASHBOARD_ISSUE: ${{ vars.PR_LIFECYCLE_DASHBOARD_ISSUE }}
        with:
          script: |
            const { run } = require('./.github/scripts/pr-lifecycle.cjs');
            await run({ github, ...context.repo, apply: true,
              dashboardIssue: Number(process.env.DASHBOARD_ISSUE) });

  stale:
    if: false
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
      issues: write
      actions: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v10.0.0
        with:
          repo-token: ${{ github.token }}
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 60
          days-before-pr-close: 14
          stale-pr-label: lifecycle-stale
          stale-pr-message: >-
            This pull request has had no updates for 60 days. It may be closed
            after another 14 days without activity. Update it to continue work,
            or ask a maintainer to apply keep-open if it should remain open.
          close-pr-message: >-
            Closing after the inactivity warning. Reopen this pull request when
            work resumes.
          exempt-pr-labels: keep-open,lifecycle-approved,lifecycle-bot
          ignore-pr-updates: false
          remove-pr-stale-when-updated: true
          exempt-draft-pr: false
          delete-branch: false
          operations-per-run: 1000
          debug-only: true
