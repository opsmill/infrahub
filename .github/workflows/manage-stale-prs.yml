---
# yamllint disable rule:truthy
name: "Manage Stale Pull Requests"

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: manage-stale-prs
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read
  issues: read

jobs:
  observe:
    if: github.repository == 'opsmill/infrahub'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: stable
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Observe complete PR inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python utilities/pr_lifecycle.py observe
          --repository opsmill/infrahub --mode observe --budget 5000
          --report "$RUNNER_TEMP/pr-lifecycle-report.json"
      - name: Report failed observation
        if: failure()
        run: echo "Observation failed; inspect the preceding step. No lifecycle changes were authorized." >> "$GITHUB_STEP_SUMMARY"
