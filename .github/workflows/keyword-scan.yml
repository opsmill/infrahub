---
# yamllint disable rule:truthy
name: "Keyword Scanner"
on: [push, pull_request]

# env:
#   KEYWORDS_LIST: ${{ secrets.KEYWORDS_LIST }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Scan for prohibited keywords
      run: |
        # Convert comma-separated secrets to array
        IFS=',' read -ra KEYWORDS <<< "${{ secrets.KEYWORD_LIST }}"
        found=false

        for keyword in "${KEYWORDS[@]}"; do
          # Trim whitespace
          keyword=$(echo "$keyword" | xargs)
          echo "Scanning for: $keyword"

          if grep -r --exclude-dir=.git --exclude-dir=node_modules \
                    --exclude="*.log" --exclude="*.lock" \
                    -i "$keyword" .; then
            echo "::error::Found prohibited keyword: $keyword"
            found=true
          fi
        done

        if [ "$found" = true ]; then
          echo "::error::Keyword scan failed - prohibited terms found"
          exit 1
        else
          echo "✅ No prohibited keywords found"
        fi
