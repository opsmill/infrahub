---
# yamllint disable rule:truthy
name: Keyword Scanner
on: [push, pull_request]

env:
  KEYWORD_LIST: ${{ secrets.KEYWORD_LIST }}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for prohibited keywords
        run: |
          # Create keyword array from secret (no echo/print of keywords)
          IFS=',' read -ra KEYWORDS <<< "$KEYWORD_LIST"
          found=false
          violations=()

          for keyword in "${KEYWORDS[@]}"; do
            # Trim whitespace
            keyword=$(echo "$keyword" | xargs)

            # Search silently - redirect output to temp file
            if grep -r --exclude-dir=.git --exclude-dir=node_modules \
                      --exclude="*.log" --exclude="*.lock" \
                      -l -i "$keyword" . > /tmp/matches 2>/dev/null; then

              # Count matches without showing the keyword
              match_count=$(wc -l < /tmp/matches)
              violations+=("$match_count file(s)")
              found=true
            fi
          done

          if [ "$found" = true ]; then
            echo "::error::Keyword scan failed - prohibited terms found in: ${violations[*]}"
            echo "Contact security team for details on specific violations"
            exit 1
          else
            echo "✅ No prohibited keywords found"
          fi
