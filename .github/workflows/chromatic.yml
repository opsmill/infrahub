---
# yamllint disable rule:truthy rule:truthy rule:line-length
name: 'Chromatic Publish'
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/packages/ui/**'
      - 'frontend/packages/graph/**'
  push:
    branches:
      - develop
      - stable
      - release-*
    paths:
      - 'frontend/packages/ui/**'
      - 'frontend/packages/graph/**'

permissions:
  contents: read

jobs:
  chromatic:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each Storybook maps to its own Chromatic project, hence one token per package.
          - package: ui
            token-secret: CHROMATIC_PROJECT_TOKEN
          - package: graph
            token-secret: CHROMATIC_GRAPH_PROJECT_TOKEN
    defaults:
      run:
        working-directory: ./frontend/packages/${{ matrix.package }}
    name: Run Chromatic (${{ matrix.package }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # In order for Chromatic to correctly determine baseline commits, tot access the full Git history graph.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets[matrix.token-secret] }}
          workingDir: ./frontend/packages/${{ matrix.package }}
      - name: Outputs Storybook URL
        run: |
          echo "Storybook URL: ${{ steps.chromatic.outputs.storybookUrl }}"
