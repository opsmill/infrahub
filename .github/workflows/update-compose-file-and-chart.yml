---
# yamllint disable rule:truthy rule:line-length
name: Update Docker Compose & helm chart on release tag

# This bumps the infrahub docker image in docker-compose.yml and the Helm chart
# appVersion whenever an infrahub-v* release tag is pushed on the main line (an
# ancestor of stable). Maintenance-branch tags are ignored.

on:
  push:
    tags:
      - 'infrahub-v*'

jobs:
  prepare-environment:
    uses: ./.github/workflows/define-versions.yml
  update-docker-compose:
    runs-on: ubuntu-latest
    needs: prepare-environment
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          submodules: true
          # Full history + tags: hatch-vcs needs the tag for installed metadata, and the
          # ancestor check below needs stable's history and the tag's ancestry.
          fetch-depth: 0
          fetch-tags: true

      - name: "Check that the tag is on the main line (ancestor of stable)"
        id: mainline
        run: |
          git fetch --no-tags origin stable
          if git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "is_mainline=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_mainline=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag ${GITHUB_REF_NAME} is not an ancestor of stable; skipping docker-compose/Helm propagation (maintenance-branch tag)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.prepare-environment.outputs.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ needs.prepare-environment.outputs.UV_VERSION }}
      - name: Install dependencies
        run: "uv sync --all-groups"

      - name: "Check prerelease type"
        id: release
        run: |
          VERSION=$(uv run python -c "import importlib.metadata; print(importlib.metadata.version('infrahub-server'))")
          echo is_prerelease=$(uv run python -c "from packaging.version import Version; print(int(Version('$VERSION').is_prerelease))") >> "$GITHUB_OUTPUT"
          echo is_devrelease=$(uv run python -c "from packaging.version import Version; print(int(Version('$VERSION').is_devrelease))") >> "$GITHUB_OUTPUT"

      - name: "Update Docker Env variable in docker-compose.yml file"
        if: steps.mainline.outputs.is_mainline == 'true' && steps.release.outputs.is_prerelease == 0 && steps.release.outputs.is_devrelease == 0
        run: "uv run invoke release.gen-config-env -u"
      - name: "Update Infrahub Image Version in docker-compose.yml file"
        if: steps.mainline.outputs.is_mainline == 'true' && steps.release.outputs.is_prerelease == 0 && steps.release.outputs.is_devrelease == 0
        run: "uv run invoke release.update-docker-compose"
      - name: Commit docker-compose.yml
        if: steps.mainline.outputs.is_mainline == 'true' && steps.release.outputs.is_prerelease == 0 && steps.release.outputs.is_devrelease == 0
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          push-branch: 'stable'
          commit-message: 'chore: update docker-compose'
          files: |
            docker-compose.yml
          name: opsmill-bot
          email: github-bot@opsmill.com
          rebase: true

      - name: Checkout infrahub-helm
        if: steps.mainline.outputs.is_mainline == 'true' && steps.release.outputs.is_prerelease == 0 && steps.release.outputs.is_devrelease == 0
        uses: actions/checkout@v7
        with:
          repository: opsmill/infrahub-helm
          path: helm
          token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}

      - name: "Update AppVersion in helm/chart.yaml file"
        if: steps.mainline.outputs.is_mainline == 'true' && steps.release.outputs.is_prerelease == 0 && steps.release.outputs.is_devrelease == 0
        run: "uv run invoke release.update-helm-chart"

      - name: Commit helm
        if: steps.mainline.outputs.is_mainline == 'true' && steps.release.outputs.is_prerelease == 0 && steps.release.outputs.is_devrelease == 0
        working-directory: helm
        run: |
          git config --global user.name "opsmill-bot"
          git config --global user.email "github-bot@opsmill.com"
          git commit -a -m 'chore: bump appVersion' || true
          git push
