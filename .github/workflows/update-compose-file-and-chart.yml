---
# yamllint disable rule:truthy rule:line-length
name: Update Docker Compose & helm chart

# Bumps the infrahub docker image pins in docker-compose.yml and the Helm chart
# appVersion to the given release version. Run this on the release branch BEFORE
# tagging the release: the tagged commit must already contain the up-to-date
# docker-compose.yml (the New Release workflow validates this and refuses to
# publish otherwise). /cut-release performs the same docker-compose.yml update
# locally, in which case the docker-compose step here is a no-op.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target release version (e.g. 1.11.0)"
        required: true
        type: string

jobs:
  prepare-environment:
    uses: ./.github/workflows/define-versions.yml
  update-docker-compose:
    runs-on: ubuntu-latest
    needs: prepare-environment
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v7"
        with:
          token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.prepare-environment.outputs.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ needs.prepare-environment.outputs.UV_VERSION }}
      - name: Install dependencies
        run: "uv sync --all-groups"

      - name: "Validate the target version"
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          uv run python - <<'EOF'
          import os
          import sys

          from packaging.version import InvalidVersion, Version

          raw = os.environ["TARGET_VERSION"]
          try:
              version = Version(raw)
          except InvalidVersion:
              sys.exit(f"Invalid target version: {raw!r}")
          if version.is_prerelease or version.is_devrelease:
              sys.exit(
                  f"{version} is a pre-release/dev version; "
                  "docker-compose.yml and the Helm chart only track final releases."
              )
          EOF

      - name: "Update Docker Env variable in docker-compose.yml file"
        run: "uv run invoke release.gen-config-env -u"
      - name: "Update Infrahub Image Version in docker-compose.yml file"
        run: "uv run invoke release.update-docker-compose --version '${{ inputs.version }}'"
      - name: Commit docker-compose.yml
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}
          push-branch: ${{ github.ref_name }}
          commit-message: 'chore: update docker-compose for release ${{ inputs.version }}'
          files: |
            docker-compose.yml
          name: opsmill-bot
          email: github-bot@opsmill.com
          rebase: true

      - name: Checkout infrahub-helm
        uses: actions/checkout@v7
        with:
          repository: opsmill/infrahub-helm
          path: helm
          token: ${{ secrets.GH_INFRAHUB_BOT_TOKEN }}

      - name: "Update AppVersion in helm/chart.yaml file"
        run: "uv run invoke release.update-helm-chart --version '${{ inputs.version }}'"

      - name: Commit helm
        working-directory: helm
        run: |
          git config --global user.name "opsmill-bot"
          git config --global user.email "github-bot@opsmill.com"
          git commit -a -m 'chore: bump appVersion' || true
          git push
