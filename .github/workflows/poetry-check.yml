---
# yamllint disable rule:truthy rule:truthy rule:line-length
name: "Poetry check"
on:
  workflow_call:
    inputs:
      directory:
        type: "string"
        description: "Directory in which poetry check will be executed"
        default: "./"
jobs:
  prepare-environment:
    uses: ./.github/workflows/define-versions.yml
  poetry_check:
    needs: prepare-environment
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v5"
        with:
          submodules: true
      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
      - name: "Setup environment"
        run: |
          python -m pip install --user pipx
          python -m pipx install -f poetry==${{ needs.prepare-environment.outputs.POETRY_VERSION }}
      - name: "Validate pyproject.toml and consistency with poetry.lock"
        run: |
          poetry check
        working-directory: ${{ github.event.inputs.directory }}
