---
# yamllint disable rule:truthy
# Rule-based labelling: pull requests get group/* labels from the paths of
# their changed files (.github/labeler.yml). Issues carry nothing an
# actions/labeler glob can match, so their labelling is handled by the
# issue-triage-labeler and issue-triage-sweep agentic workflows instead.
name: "Labeler"

on:
  pull_request:

jobs:
  pull-request:
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
