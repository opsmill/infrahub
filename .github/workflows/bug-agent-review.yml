---
# .github/workflows/bug-agent-review.yml
# Triggered when a draft PR is opened by the bug fixer agent (detected via the AGENT_FIX_COMPLETE marker).
# Responsibility: review the fix against code quality standards AND internal documentation.

name: "Bug reviewer agent"

"on":
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    if: contains(github.event.pull_request.body, 'AGENT_FIX_COMPLETE')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read prompt
        id: prompt
        run: |
          echo "PROMPT<<EOF" >> $GITHUB_OUTPUT
          cat .github/bug-agent-pipeline/reviewer.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: anthropics/claude-code-action@main
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # model: claude-opus-4-6
          prompt: |
            ${{ steps.prompt.outputs.PROMPT }}

            ## PR details
            Title: ${{ github.event.pull_request.title }}
            Branch: ${{ github.event.pull_request.head.ref }}
            PR URL: ${{ github.event.pull_request.html_url }}

            ## PR description (from the bug fixer agent)
            ${{ github.event.pull_request.body }}
