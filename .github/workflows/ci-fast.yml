      needs.stage-2-gate.result == 'success' &&
      needs.stage-2-gate.outputs.run_regression == 'true' &&
      (needs.files-changed.outputs.release == 'true' || needs.files-changed.outputs.documentation == 'true')
    needs: ["stage-2-gate", "prepare-environment", "files-changed"]
    runs-on: "ubuntu-22.04"
    timeout-minutes: 5
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
        with:
          submodules: true
      - name: Install NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json
      - name: Set up Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ needs.prepare-environment.outputs.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ needs.prepare-environment.outputs.UV_VERSION }}
      - name: Install dependencies
        run: "uv sync --all-groups"
      - name: "Install npm dependencies"
        working-directory: ./docs
        run: npm install
      - name: "Build docs"
        run: "uv run invoke docs.build"

  validate-generated-documentation:
    if: |
      always() && !cancelled() &&
      needs.stage-2-gate.result == 'success' &&
      needs.stage-2-gate.outputs.run_regression == 'true' &&
      (needs.files-changed.outputs.python == 'true' ||
