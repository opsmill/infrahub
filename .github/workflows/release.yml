---
# yamllint disable rule:truthy rule:line-length
name: New Release

on:
  release:
    types:
      - published

permissions: {}

jobs:
  prepare-environment:
    permissions:
      contents: read
    uses: ./.github/workflows/define-versions.yml
  check_release:
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    needs: prepare-environment
    outputs:
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
      is_devrelease: ${{ steps.release.outputs.is_devrelease }}
      version: ${{ steps.release.outputs.version }}
      major_minor_version: ${{ steps.release.outputs.major_minor_version }}
      latest_tag: ${{ steps.release.outputs.latest_tag }}
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
        with:
          submodules: true

      - name: "Set up Python"
        id: python
        uses: "actions/setup-python@v6"
        with:
          python-version: ${{ needs.prepare-environment.outputs.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ needs.prepare-environment.outputs.UV_VERSION }}
      - name: Install dependencies
        run: "uv sync --all-groups"

      - name: "Check prerelease type"
        id: release
        run: |
          echo is_prerelease=$(uv run python -c "from packaging.version import Version; print(int(Version('$(uv version --short)').is_prerelease))") >> "$GITHUB_OUTPUT"
          echo is_devrelease=$(uv run python -c "from packaging.version import Version; print(int(Version('$(uv version --short)').is_devrelease))") >> "$GITHUB_OUTPUT"
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
          echo major_minor_version=$(uv run python -c "from packaging.version import Version; print(f\"{Version('$(uv version --short)').major}.{Version('$(uv version --short)').minor}\")") >> "$GITHUB_OUTPUT"
          echo latest_tag=$(curl -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/releases/latest \
              | jq -r '.tag_name') >> "$GITHUB_OUTPUT"

      - name: Check tag version
        if: github.event.release.tag_name != format('infrahub-v{0}', steps.release.outputs.version)
        run: |
          echo "Tag version does not match python project version"
          exit 1

      - name: Check prerelease and project version
        if: github.event.release.prerelease == true && steps.release.outputs.is_prerelease == 0 && steps.release.outputs.is_devrelease == 0
        run: |
          echo "Cannot pre-release a non pre-release or non dev-release version (${{ steps.release.outputs.version }})"
          exit 1

      - name: Check release and project version
        if: github.event.release.prerelease == false && (steps.release.outputs.is_prerelease == 1 || steps.release.outputs.is_devrelease == 1)
        run: |
          echo "Cannot release a pre-release or dev-release version (${{ steps.release.outputs.version }})"
          exit 1


  meta_data:
    permissions:
      contents: read
    needs: check_release
    runs-on: ubuntu-22.04
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Set docker image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ vars.HARBOR_HOST }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.check_release.outputs.version }}
            type=raw,value=${{ github.event.release.prerelease == false && needs.check_release.outputs.major_minor_version || '' }}
            type=raw,value=${{ github.event.release.prerelease == true && 'preview' || 'stable' }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
          flavor: |
            latest=${{ needs.check_release.outputs.latest_tag == github.event.release.tag_name }}

  publish-docker-image:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-docker-image.yml
    secrets:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    needs: meta_data
    with:
      publish: true
      version: ${{ github.ref_name }}
      ref: ${{ github.sha }}
      tags: ${{ needs.meta_data.outputs.tags }}
      labels: ${{ needs.meta_data.outputs.labels }}

  publish-helm-chart:
    permissions:
      contents: read
    needs: check_release
    if: github.event.release.prerelease == false
    uses: opsmill/infrahub-helm/.github/workflows/publish-helm-chart.yml@stable
    secrets: inherit
    with:
      publish: true
      chart: infrahub

  publish-pypi:
    permissions:
      contents: read
    needs: check_release
    uses: ./.github/workflows/publish-pypi.yml
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    with:
      publish: true

  repository-dispatch:
    permissions:
      contents: read
    needs:
      - check_release
      - publish-docker-image
    uses: ./.github/workflows/repository-dispatch.yml
    secrets:
      GH_UPDATE_PACKAGE_OTTO: ${{ secrets.GH_UPDATE_PACKAGE_OTTO }}
      INFRAHUB_PACKER_REPOSITORY: ${{ secrets.INFRAHUB_PACKER_REPOSITORY }}
      INFRAHUB_ENTERPRISE_REPOSITORY: ${{ secrets.INFRAHUB_ENTERPRISE_REPOSITORY }}
      INFRAHUB_CUSTOMER1_REPOSITORY: ${{ secrets.INFRAHUB_CUSTOMER1_REPOSITORY }}
      INFRAHUB_CUSTOMER3_REPOSITORY: ${{ secrets.INFRAHUB_CUSTOMER3_REPOSITORY }}
    with:
      version: ${{ needs.check_release.outputs.version }}

  update-sdk-compatibility-docs:
    permissions:
      contents: read
    needs: check_release
    if: github.event.release.prerelease == false
    uses: ./.github/workflows/update-sdk-compatibility-docs.yml
    secrets: inherit
