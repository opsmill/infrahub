---
# .github/workflows/bug-agent-test.yml
# Triggered when the bug analyst agent posts its analysis (AGENT_ANALYSIS_COMPLETE marker).
# Responsibility: write a failing test that reproduces the bug.

name: "Bug test-writer agent"

"on":
  issue_comment:
    types: [created]

jobs:
  write-test:
    if: |
      contains(github.event.comment.body, 'AGENT_ANALYSIS_COMPLETE') &&
      contains(github.event.issue.labels.*.name, 'type/bug')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read prompt
        id: prompt
        run: |
          echo "PROMPT<<EOF" >> $GITHUB_OUTPUT
          cat .github/bug-agent-pipeline/test-writer.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: anthropics/claude-code-action@6062f3709600659be5e47fcddf2cf76993c235c2 # main 2026-03-23
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # model: claude-opus-4-6
          prompt: |
            ${{ steps.prompt.outputs.PROMPT }}

            ## Original bug report
            Title: ${{ github.event.issue.title }}
            URL: ${{ github.event.issue.html_url }}
            Issue number: ${{ github.event.issue.number }}

            ## Analysis from the bug analyst agent
            ${{ github.event.comment.body }}
