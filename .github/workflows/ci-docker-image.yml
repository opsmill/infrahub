---
# yamllint disable rule:truthy rule:line-length
name: Build And Push Docker image

# When calling this workflow, ensure you use
#   secrets: inherit

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: Wether to publish the image to Infrahub Private Registry
        required: false
        default: false
      version:
        type: string
        required: false
        description: The string to extract semver labels from.
        default: ''
      ref:
        type: string
        required: true
        description: The GIT ref from which the image will be build
      tags:
        type: string
        required: true
        description: The tags for the docker image
      labels:
        type: string
        required: true
        description: The labels for the docker image
      platforms:
        type: string
        required: false
        description: Comma separated platform list to build the image for
        default: "linux/amd64,linux/arm64"
      artifact_prefix:
        type: string
        required: false
        description: >
          Prefix used to namespace the per-platform digest artifacts. Must be unique per
          invocation when this reusable workflow is called more than once within the same
          caller run (artifacts are scoped to the run, not the invocation), otherwise the
          merge step mixes digests across invocations.
        default: digests

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  DOCKERFILE: "development/Dockerfile"
  # Retry budget for cosign's Sigstore transparency-log writes, shared by the sign and
  # sbom jobs. Delays back off exponentially from the base: 15s, 30s, 60s, 120s.
  COSIGN_RETRY_ATTEMPTS: "5"
  COSIGN_RETRY_BASE_DELAY_SECONDS: "15"

jobs:
  prepare-environment:
    uses: ./.github/workflows/define-versions.yml

  build:
    needs: prepare-environment
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      UV_VERSION: ${{ needs.prepare-environment.outputs.UV_VERSION }}
    steps:
      - name: Check if platform is requested
        id: check
        run: |
          if [[ "${{ inputs.platforms }}" != *"${{ matrix.platform }}"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.check.outputs.skip == 'false' && inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push by digest
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          provenance: false   # To avoid cross platform "unknown"
          push: ${{ inputs.publish }}
          target: "backend"
          platforms: ${{ matrix.platform }}
          labels: ${{ inputs.labels }}
          build-args: |
            UV_VER=${{ env.UV_VERSION }}
          outputs: ${{ inputs.publish && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', vars.HARBOR_HOST, github.repository) || '' }}

      - name: Export digest
        if: steps.check.outputs.skip == 'false' && inputs.publish
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.check.outputs.skip == 'false' && inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: ${{ inputs.artifact_prefix }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          SOURCES=$(printf '${{ vars.HARBOR_HOST }}/${{ github.repository }}@sha256:%s ' *)
          TAGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAGS="$TAGS --tag $tag"
          done <<< "${{ inputs.tags }}"
          docker buildx imagetools create $TAGS $SOURCES

      - name: Inspect manifest
        id: inspect
        run: |
          FIRST_TAG=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            FIRST_TAG="$tag"
            break
          done <<< "${{ inputs.tags }}"
          digest=$(docker buildx imagetools inspect "$FIRST_TAG" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  sign:
    needs: merge
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Sign manifest
        env:
          IMAGE: ${{ vars.HARBOR_HOST }}/${{ github.repository }}@${{ needs.merge.outputs.digest }}
        run: |
          # cosign gives up after two internal attempts when a Sigstore transparency
          # log write fails, so a brief rekor.sigstore.dev blip is enough to fail a
          # release. Retry the whole command with exponential backoff instead.
          #
          # The sbom job repeats this loop. sign and sbom run on separate runners, so a
          # shell function cannot be shared between them, and reaching a local composite
          # action would mean adding actions/checkout to two jobs that need no source.
          # The tunables live in the workflow env block so that only the loop body, not
          # the retry budget, exists in two places.
          for attempt in $(seq 1 "${COSIGN_RETRY_ATTEMPTS}"); do
            if cosign sign --yes --recursive \
              --new-bundle-format=false --use-signing-config=false \
              "${IMAGE}"; then
              exit 0
            fi
            if [ "${attempt}" -eq "${COSIGN_RETRY_ATTEMPTS}" ]; then
              break
            fi
            delay=$((COSIGN_RETRY_BASE_DELAY_SECONDS * 2 ** (attempt - 1)))
            echo "::warning::cosign sign failed (attempt ${attempt}/${COSIGN_RETRY_ATTEMPTS}), retrying in ${delay}s"
            sleep "${delay}"
          done
          echo "::error::cosign sign failed after ${COSIGN_RETRY_ATTEMPTS} attempts"
          exit 1

  sbom:
    needs: merge
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Generate SBOM (SPDX)
        run: |
          syft \
            "${{ vars.HARBOR_HOST }}/${{ github.repository }}@${{ needs.merge.outputs.digest }}" \
            --output spdx-json=infrahub-sbom.spdx.json

      - name: Generate SBOM (CycloneDX)
        run: |
          syft \
            "${{ vars.HARBOR_HOST }}/${{ github.repository }}@${{ needs.merge.outputs.digest }}" \
            --output cyclonedx-json=infrahub-sbom.cdx.json

      # Uploaded before the attestations so that a transparency-log outage cannot cost
      # us the SBOMs themselves: v1.10.7 shipped without any because the attest step
      # failed first and skipped this one.
      #
      # overwrite is required precisely because this now runs before a step that can
      # fail. Artifacts are scoped to the run rather than the attempt, so on a re-run
      # this name already exists from the earlier attempt and the default overwrite:
      # false would fail the upload, breaking the recovery path this ordering exists to
      # protect. Every caller passes a version unique to its invocation, so the only
      # artifact this can replace is the same SBOM from a previous attempt.
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ inputs.version }}
          path: |
            infrahub-sbom.spdx.json
            infrahub-sbom.cdx.json
          retention-days: 90
          overwrite: true

      - name: Attest SBOMs
        env:
          IMAGE: ${{ vars.HARBOR_HOST }}/${{ github.repository }}@${{ needs.merge.outputs.digest }}
        run: |
          # Same transparency-log flakiness the sign job guards against; retry both
          # predicates rather than losing the release to a single failed Rekor write.
          # The retry budget is shared with that job via the workflow env block.
          attest_with_retry() {
            local predicate_type="$1" predicate_file="$2" attempt delay
            for attempt in $(seq 1 "${COSIGN_RETRY_ATTEMPTS}"); do
              if cosign attest --yes \
                --type "${predicate_type}" \
                --predicate "${predicate_file}" \
                "${IMAGE}"; then
                return 0
              fi
              if [ "${attempt}" -eq "${COSIGN_RETRY_ATTEMPTS}" ]; then
                break
              fi
              delay=$((COSIGN_RETRY_BASE_DELAY_SECONDS * 2 ** (attempt - 1)))
              echo "::warning::cosign attest ${predicate_type} failed (attempt ${attempt}/${COSIGN_RETRY_ATTEMPTS}), retrying in ${delay}s"
              sleep "${delay}"
            done
            echo "::error::cosign attest ${predicate_type} failed after ${COSIGN_RETRY_ATTEMPTS} attempts"
            return 1
          }

          attest_with_retry spdxjson infrahub-sbom.spdx.json
          attest_with_retry cyclonedx infrahub-sbom.cdx.json
