---
# yamllint disable rule:truthy rule:line-length
name: Build And Push Docker image

# When calling this workflow, ensure you use
#   secrets: inherit

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        description: Wether to publish the image to Infrahub Private Registry
        required: false
        default: false
      version:
        type: string
        required: false
        description: The string to extract semver labels from.
        default: ''
      ref:
        type: string
        required: true
        description: The GIT ref from which the image will be build
      tags:
        type: string
        required: true
        description: The tags for the docker image
      labels:
        type: string
        required: true
        description: The labels for the docker image
      platforms:
        type: string
        required: false
        description: Comma separated platform list to build the image for
        default: "linux/amd64,linux/arm64"
      artifact_prefix:
        type: string
        required: false
        description: >
          Prefix used to namespace the per-platform digest artifacts. Must be unique per
          invocation when this reusable workflow is called more than once within the same
          caller run (artifacts are scoped to the run, not the invocation), otherwise the
          merge step mixes digests across invocations.
        default: digests

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: true

env:
  DOCKERFILE: "development/Dockerfile"

jobs:
  prepare-environment:
    uses: ./.github/workflows/define-versions.yml

  build:
    needs: prepare-environment
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      UV_VERSION: ${{ needs.prepare-environment.outputs.UV_VERSION }}
    steps:
      - name: Check if platform is requested
        id: check
        run: |
          if [[ "${{ inputs.platforms }}" != *"${{ matrix.platform }}"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          # Full history + tags so the Dockerfile's hatch-vcs resolver reads the real tag version
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        if: steps.check.outputs.skip == 'false' && inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push by digest
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: push
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          provenance: false   # To avoid cross platform "unknown"
          push: ${{ inputs.publish }}
          target: "backend"
          platforms: ${{ matrix.platform }}
          labels: ${{ inputs.labels }}
          build-args: |
            UV_VER=${{ env.UV_VERSION }}
          outputs: ${{ inputs.publish && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', vars.HARBOR_HOST, github.repository) || '' }}

      - name: Export digest
        if: steps.check.outputs.skip == 'false' && inputs.publish
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.check.outputs.skip == 'false' && inputs.publish
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: ${{ inputs.artifact_prefix }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          SOURCES=$(printf '${{ vars.HARBOR_HOST }}/${{ github.repository }}@sha256:%s ' *)
          TAGS=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            TAGS="$TAGS --tag $tag"
          done <<< "${{ inputs.tags }}"
          docker buildx imagetools create $TAGS $SOURCES

      - name: Inspect manifest
        id: inspect
        run: |
          FIRST_TAG=""
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            FIRST_TAG="$tag"
            break
          done <<< "${{ inputs.tags }}"
          digest=$(docker buildx imagetools inspect "$FIRST_TAG" \
            --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  sign:
    needs: merge
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Sign manifest
        env:
          IMAGE: ${{ vars.HARBOR_HOST }}/${{ github.repository }}@${{ needs.merge.outputs.digest }}
        run: |
          # cosign gives up after two internal attempts when a Sigstore transparency
          # log write fails, so a brief rekor.sigstore.dev blip is enough to fail a
          # release. Retry the whole command instead; five attempts 60s apart cover a
          # ~4-minute outage. The sbom job carries a verbatim copy of this function:
          # the jobs run on separate runners, so sharing it would take a checkout or a
          # third-party action in the signing path. Keep the two copies identical.
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -lt 5 ]; then
                echo "::warning::${1} ${2} failed (attempt ${attempt}/5), retrying in 60s"
                sleep 60
              fi
            done
            echo "::error::${1} ${2} failed after 5 attempts"
            return 1
          }

          retry cosign sign --yes --recursive \
            --new-bundle-format=false --use-signing-config=false \
            "${IMAGE}"

  sbom:
    needs: merge
    if: inputs.publish
    runs-on: ubuntu-24.04
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Login to Harbor
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ vars.HARBOR_HOST }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Generate SBOM (SPDX)
        run: |
          syft \
            "${{ vars.HARBOR_HOST }}/${{ github.repository }}@${{ needs.merge.outputs.digest }}" \
            --output spdx-json=infrahub-sbom.spdx.json

      - name: Generate SBOM (CycloneDX)
        run: |
          syft \
            "${{ vars.HARBOR_HOST }}/${{ github.repository }}@${{ needs.merge.outputs.digest }}" \
            --output cyclonedx-json=infrahub-sbom.cdx.json

      # Uploaded before the attestations so that a transparency-log outage cannot cost
      # us the SBOMs themselves: v1.10.7 shipped without any because the attest step
      # failed first and skipped this one.
      #
      # overwrite is required precisely because this now runs before a step that can
      # fail. Artifacts are scoped to the run rather than the attempt, so on a re-run
      # this name already exists from the earlier attempt and the default overwrite:
      # false would fail the upload, breaking the recovery path this ordering exists to
      # protect. Every caller passes a version unique to its invocation, so the only
      # artifact this can replace is the same SBOM from a previous attempt.
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ inputs.version }}
          path: |
            infrahub-sbom.spdx.json
            infrahub-sbom.cdx.json
          retention-days: 90
          overwrite: true

      - name: Attest SBOMs
        env:
          IMAGE: ${{ vars.HARBOR_HOST }}/${{ github.repository }}@${{ needs.merge.outputs.digest }}
        run: |
          # Same transparency-log flakiness the sign job guards against; this is a
          # verbatim copy of that job's retry function (separate runners, so it cannot
          # be shared without a checkout or a third-party action in the signing path).
          # Keep the two copies identical.
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -lt 5 ]; then
                echo "::warning::${1} ${2} failed (attempt ${attempt}/5), retrying in 60s"
                sleep 60
              fi
            done
            echo "::error::${1} ${2} failed after 5 attempts"
            return 1
          }

          retry cosign attest --yes \
            --type spdxjson \
            --predicate infrahub-sbom.spdx.json \
            "${IMAGE}"

          retry cosign attest --yes \
            --type cyclonedx \
            --predicate infrahub-sbom.cdx.json \
            "${IMAGE}"
