---
# yamllint disable rule:truthy rule:truthy rule:line-length
name: "uv check"
on:
  workflow_call:
    inputs:
      directory:
        type: "string"
        description: "Directory in which uv check will be executed"
        default: "./"
jobs:
  prepare-environment:
    uses: ./.github/workflows/define-versions.yml
  uv_check:
    needs: prepare-environment
    runs-on: "ubuntu-latest"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v5"
        with:
          submodules: true
      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ needs.prepare-environment.outputs.UV_VERSION }}
      - name: "Validate pyproject.toml and consistency with uv.lock"
        run: |
          uv lock --locked --offline
        working-directory: ${{ github.event.inputs.directory }}
