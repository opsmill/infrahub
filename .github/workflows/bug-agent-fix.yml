---
# .github/workflows/bug-agent-fix.yml
# Triggered when the test-writer agent posts its comment (detected via the AGENT_TEST_COMPLETE marker).
# Responsibility: implement the fix and open a draft PR.

name: "Bug fixer agent"

"on":
  issue_comment:
    types: [created]

jobs:
  fix:
    if: |
      contains(github.event.comment.body, 'AGENT_TEST_COMPLETE') &&
      contains(github.event.issue.labels.*.name, 'type/bug') &&
      (
        github.actor == 'claude[bot]' ||
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read prompt
        id: prompt
        run: |
          echo "PROMPT<<EOF" >> $GITHUB_OUTPUT
          cat .github/bug-agent-pipeline/fixer.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # model: claude-opus-4-6
          prompt: |
            ${{ steps.prompt.outputs.PROMPT }}

            ## Original bug report
            Title: ${{ github.event.issue.title }}
            URL: ${{ github.event.issue.html_url }}
            Issue number: ${{ github.event.issue.number }}

            ## Analysis and test from preceding agents
            ${{ github.event.comment.body }}
