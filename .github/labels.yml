---
# Labels names are important as they are used by Release Drafter to decide
# regarding where to record them in changelog or if to skip them.
#
# The repository labels will be automatically configured using this file and
# the GitHub Action https://github.com/marketplace/actions/github-labeler.
#
# The issue-triage agentic workflows (.github/workflows/issue-triage-*.md) read
# the group/* and category/* descriptions from this file at runtime as their
# classification definitions — keep those descriptions self-sufficient.
# GitHub caps label descriptions at 100 characters.

# ----------------------------------
# GROUP
# Which component owns the issue, exactly one per issue. A description that
# says "not applied by automation" marks a label the triage workflows must
# never apply (they are also absent from the workflows' allowlists).
# ----------------------------------
- name: "group/backend"
  description: "API server, GraphQL, task worker (Prefect), database, Python code"
  color: "b60205"

- name: "group/frontend"
  description: "React UI: rendering, forms, layout, client-side queries"
  color: "353755"

- name: "group/ux-design"
  description: "Design or UX work. Human-applied, not applied by automation"
  color: "3380ff"

- name: "group/sync-engine"
  description: "The infrahub-sync project, a separate repo (opsmill/infrahub-sync): filed here, belongs there"
  color: "05b259"

- name: "group/ci"
  description: "CI pipeline, GitHub Actions, build tooling"
  color: "f25009"

- name: "group/schema"
  description: "Legacy, superseded by category/schema-lifecycle. Kept for old issues, not applied by automation"
  color: "fbceb1"

# ----------------------------------
# CATEGORY
# Functional domain of a bug, orthogonal to group/* (which component owns it).
# One primary category per issue.
# ----------------------------------
- name: "category/scaling"
  description: "Bug that only appears or gets materially worse with data volume; timeouts, OOM, slow at scale"
  color: "1d76db"

- name: "category/git-sync"
  description: "Repository sync/import from Git: read-only repos, objects files, .infrahub.yml, commits, clones"
  color: "1d76db"

- name: "category/schema-lifecycle"
  description: "Schema load, import, validation, migration, inheritance and attribute definition semantics"
  color: "1d76db"

- name: "category/branching"
  description: "Branch create/merge/rebase/diff, proposed changes, conflict handling"
  color: "1d76db"

- name: "category/tasks"
  description: "Task manager and Prefect workflow lifecycle: stuck runs, missing or incorrect tasks in the list"
  color: "1d76db"

- name: "category/generators-artifacts"
  description: "Generator, artifact and transform pipeline: definitions, regeneration, execution"
  color: "1d76db"

- name: "category/api"
  description: "GraphQL/REST semantics: queries, filters, mutations, events, webhooks, response shape"
  color: "1d76db"

- name: "category/error-reporting"
  description: "The defect is the error/message quality; apply only when the behaviour itself is correct"
  color: "1d76db"

- name: "category/permissions"
  description: "Authentication, authorization, roles, tokens, object permissions"
  color: "1d76db"

- name: "category/pools"
  description: "Resource pools: NumberPool, prefix pools, IPAM allocation"
  color: "1d76db"

# ----------------------------------
# TYPE INFRAHUB (default)
# ----------------------------------
- name: "type/feature"
  description: "New feature or request"
  color: "a2eeef"

- name: "type/bug"
  description: "Something isn't working as expected"
  color: "d73a4a"

- name: "type/housekeeping"
  description: "Maintenance task"
  color: "fef2c0"

- name: "type/tech-debt"
  description: "Item we know we need to improve way it is implemented"
  color: "73FA20"

# ----------------------------------
# TYPE ALL
# ----------------------------------
- name: "type/question"
  description: "Question or discussion"
  color: "d876e3"

- name: "type/documentation"
  description: "Improvements or additions to documentation"
  color: "0075ca"

- name: "type/duplicate"
  description: "This issue or pull request already exists"
  color: "cfd3d7"

- name: "type/epic"
  description: "Large body of work composed of multiple tasks and/or features"
  color: "fbd39c"

- name: "type/task"
  description: "Body of work related to an epic"
  color: "0b8e92"

- name: "type/ecosystem"
  description: "Effort related to the community, usually not part of the core project"
  color: "0b5aa9"

- name: "type/brainstorming"
  description: "Topic for brainstorming, discussions"
  color: "e19e0f"

- name: "type/spec"
  description: "A specification for an upcoming change to the project"
  color: "8b5cf6"

- name: "type/user-centric"
  description: "Issue that would improve the overall experience of our users"
  color: "ff8c00"

- name: "type/newcomers"
  description: "Good for newcomers"
  color: "309c56"

# ----------------------------------
# EFFORT
# ----------------------------------
- name: "effort/high"
  description: "This issue should be completed in more than a day"
  color: "b60205"

- name: "effort/medium"
  description: "This issue should be completed in a less than a day"
  color: "ff9f1c"

- name: "effort/low"
  description: "This issue should be completed in a couple of hours"
  color: "ffcc00"

# ----------------------------------
# SEVERITY
# ----------------------------------
- name: "priority/1"
  description: "This issue must be fixed/implemented ASAP, it's a blocker for a release"
  color: "b60205"

- name: "priority/2"
  description: "This issue stalls work on the project or its dependents, it's a blocker for a release"
  color: "ff9f1c"

- name: "priority/3"
  description: "Not blocking but should be fixed soon"
  color: "ffcc00"

- name: "priority/4"
  description: "Low priority and doesn't need to be rushed"
  color: "cfda2c"

# ----------------------------------
# STATUS
# ----------------------------------
- name: "state/blocked"
  description: "The issue is currently blocked and cannot be resolved."
  color: "e34918"

- name: "state/draft"
  description: "The redaction of the issue is still a work in progress"
  color: "dcb518"

- name: "state/need-triage"
  description: "This issue needs to be triaged"
  color: "333333"

- name: "state/need-more-info"
  description: "This issue needs more information"
  color: "cccccc"

- name: "state/need-decision"
  description: "Behaviour is intentional but contested, needs a human judgement call"
  color: "fbca04"

- name: "state/need-testing"
  description: "This issue is ready and needs to be tested."
  color: "cccccc"

- name: "state/needs-human-fix"
  description: "The bug agent pipeline could not fix this issue automatically"
  color: "e34918"

- name: "state/needs-human-test"
  description: "The bug agent pipeline could not write a test for this issue automatically"
  color: "e34918"

- name: "state/backlog"
  description: "This issue is part of the backlog"
  color: "eeeeee"

- name: "state/verified-2026-08"
  description: "Checked against current code during the 2026-08 backlog triage, confirmed still valid"
  color: "0e8a16"

- name: "state/planned"
  description: "This issue is planned to be worked on in an upcoming release."
  color: "eeeeee"

- name: "state/not-reproducible"
  description: "Unable to reproduce this issue."
  color: "eeeeee"

- name: "state/wont-fix"
  description: "Issue has been closed and won't be fix/implemented."
  color: "eeeeee"

# DEPRECATED
- name: "state/ref"
  description: "This issue is referenced in our internal tooling"
  color: "c9510c"

# ----------------------------------
# CI
# ----------------------------------
- name: "ci/skip-changelog"
  description: "Don't include this PR in the changelog"
  color: "c30664"

- name: "ci/run-intensive-benchmarks"
  description: "Run intensive CodSpeed benchmarks, usually excluded."
  color: "73FA20"

- name: "cd/preview"
  description: "Deploy preview branch"
  color: "d77e96"

- name: "stale"
  description: "Marks stale issues and pull requests"
  color: "ffffff"
