---
ci_config: &ci_config
  - ".github/workflows/ci.yml"
  - ".github/file-filters.yml"

github_workflows: &github_workflows
  - ".github/workflows/*.yml"

development_files: &development_files
  - "development/**"
  - "tasks/**"

backend_files: &backend_files
  - "backend/**"

sdk_files: &sdk_files
  - "python_sdk" # Catch updates to the submodule commit

testcontainers_files:
  - "python_testcontainers/**"

infrahub_uv_files: &infrahub_uv_files
  - "**/pyproject.toml"
  - "**/uv.lock"

frontend_files: &frontend_files
  - "frontend/app/**"

openapi_schema_files: &openapi_schema_files
  - "schema/openapi.json"
  - "frontend/app/src/shared/api/rest/types.generated.ts"

graphql_schema_files: &graphql_schema_files
  - "schema/schema.graphql"
  - "frontend/app/src/shared/api/graphql/graphql-env.d.ts"
  - "frontend/app/src/shared/api/graphql/graphql-cache.d.ts"

e2e_test_files:
  - "frontend/app/tests/e2e/**"

demo_files: &demo_files
  - "models/**"

doc_files: &doc_files
  - "docs/**"
  - package.json
  - package-lock.json

release_files: &release_files
  - "changelog/*.md"
  - CHANGELOG.md
  - "docs/docs/release_notes/infrahub/*.mdx"

python_all: &python_all
  - "**/*.py"

javascript_all: &javascript_all
  - "**/*.[tj]{s,sx}"

yaml_all: &yaml_all
  - "**/*.{yml,yaml}"

markdown_all: &markdown_all
  - "**/*.{md,mdx}"

infrahub_reference_generated: &infrahub_reference_generated
  - "docs/docs/reference/infrahub-cli/*.mdx"
  - "docs/docs/reference/schema/*.mdx"
  - "docs/docs/reference/dotinfrahub.mdx"
  - "docs/docs/python-sdk/reference/config.mdx"
  - "docs/docs/reference/message-bus-events.mdx"

infrahub_ctl_generated: &infrahub_ctl_generated
  - "docs/docs/infrahubctl/*.mdx"

backend_all:
  - *backend_files
  - *ci_config
  - *development_files
  - *infrahub_uv_files
  - *sdk_files

documentation_all:
  - *development_files
  - *doc_files
  - *markdown_all

documentation_generated_all:
  - *infrahub_reference_generated
  - *infrahub_ctl_generated

release_all:
  - *release_files

frontend_all:
  - *frontend_files
  - *openapi_schema_files
  - *ci_config
  - *development_files

openapi_schema_all:
  - *openapi_schema_files

graphql_schema_all:
  - *graphql_schema_files

e2e_all:
  - *backend_files
  - *frontend_files
  - *demo_files
  - *ci_config
  - *development_files
  - *infrahub_uv_files
