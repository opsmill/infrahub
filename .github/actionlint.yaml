---
# The *.lock.yml workflows are generated by `gh aw compile` from the
# .github/workflows/*.md sources. Their embedded shell snippets and YAML
# formatting are owned by gh-aw, not by this repo, so we suppress actionlint
# diagnostics on them to avoid false positives in CI.
paths:
  .github/workflows/manage-stale-prs.yml:
    ignore:
      # The mutation job must remain unconditionally disabled until activation is reviewed.
      - '^constant expression "false" in condition\. remove the if: section$'
  .github/workflows/*.lock.yml:
    ignore:
      - ".*"
