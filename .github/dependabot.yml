---
# yamllint disable rule:truthy
version: 2

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    target-branch: stable
    labels:
      - "type/housekeeping"
      - "ci/skip-changelog"

  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    target-branch: stable
    labels:
      - "type/housekeeping"
      - "ci/skip-changelog"

  # Documentation dependencies (Docusaurus)
  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    target-branch: stable
    labels:
      - "type/housekeeping"
      - "ci/skip-changelog"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    target-branch: stable
    labels:
      - "type/housekeeping"
      - "ci/skip-changelog"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    target-branch: stable
    labels:
      - "type/housekeeping"
      - "ci/skip-changelog"
