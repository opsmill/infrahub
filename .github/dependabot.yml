updates:
- directory: /
  ignore:
  - dependency-name: "github/gh-aw-actions/**" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - type/housekeeping
  - ci/skip-changelog
  package-ecosystem: github-actions
  schedule:
    day: monday
    interval: weekly
    time: "09:00"
  target-branch: stable
# allow update-types limit version updates only, so security updates still reach every dependency.
- allow:
  - dependency-type: production
    update-types:
    - version-update:semver-patch
  - dependency-type: development
    update-types:
    - version-update:semver-minor
    - version-update:semver-patch
  directory: /frontend
  groups:
    frontend-security:
      applies-to: security-updates
      patterns:
      - "*"
    frontend-production:
      dependency-type: production
      patterns:
      - "*"
    frontend-development:
      dependency-type: development
      patterns:
      - "*"
  labels:
  - type/housekeeping
  - ci/skip-changelog
  package-ecosystem: npm
  schedule:
    day: monday
    interval: weekly
    time: "09:00"
- directory: /docs
  groups:
    docs-security:
      applies-to: security-updates
      patterns:
      - "*"
    docs:
      patterns:
      - "*"
  labels:
  - type/housekeeping
  - ci/skip-changelog
  package-ecosystem: npm
  schedule:
    day: monday
    interval: weekly
    time: "09:00"
- directories:
  - /
  - /python_testcontainers
  groups:
    opentelemetry-security:
      applies-to: security-updates
      patterns:
      - "opentelemetry-*"
    python-security:
      applies-to: security-updates
      patterns:
      - "*"
  open-pull-requests-limit: 0 # Security updates only; a limit of 0 turns version updates off.
  package-ecosystem: uv
  schedule:
    day: monday
    interval: weekly
    time: "09:00"
version: 2
