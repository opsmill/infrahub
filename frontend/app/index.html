<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Unleash the full power of infrastructure automation">
    <link rel="icon" href="/favicons/favicon.ico">
    <link rel="apple-touch-icon" href="/favicons/logo192.png">
    <link rel="manifest" href="/manifest.json">
    <title>Infrahub</title>
    <script>
    // Paints the last resolved theme before the first frame, so a reload does not flash light and
    // then snap to dark once the config request returns. Blocking is the point: it has to run
    // before the browser paints, which rules out the module graph, and so also rules out importing
    // the key name from src/shared/theme/theme-storage.ts — it is duplicated here on purpose.
    // Only the resolved mirror is read, never the user's raw choice: the mirror records what the
    // app actually settled on once the feature flag had its say, while the raw choice may name a
    // theme this deployment no longer offers. Only the exact string "dark" turns the class on, so
    // anything unexpected in storage, and storage being unreadable at all, both land on light.
    "use strict";
    try {
      if (localStorage.getItem("infrahub.theme.resolved") === "dark") {
        document.documentElement.classList.add("dark");
      }
    } catch {
      // Storage is disabled; light it is.
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
  <script type="module" src="/src/main.tsx"></script>
</html>
