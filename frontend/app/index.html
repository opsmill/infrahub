<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Unleash the full power of infrastructure automation">
    <link rel="icon" href="/favicons/favicon.ico">
    <link rel="apple-touch-icon" href="/favicons/logo192.png">
    <link rel="manifest" href="/manifest.json">
    <title>Infrahub</title>
    <script>
    "use strict";
    {
      let theme = null;
      try {
        theme = localStorage.getItem("infrahub.theme.choice");
      } catch {
        // Handle when site data is blocked
      }
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (theme === "dark" || (theme !== "light" && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
  <script type="module" src="/src/main.tsx"></script>
</html>
