# pnpm workspace for the in-repo frontend packages.
# The schema-visualizer is a git submodule (its own repo) and is intentionally NOT a
# workspace member — it stays a file: dependency so it keeps building standalone.
packages:
  - app
  - packages/ui

overrides:
  playwright: 1.56.1
  playwright-core: 1.56.1

peerDependencyRules:
  allowedVersions:
    graphiql-explorer>graphql: ^16.0.0
    graphiql-explorer>react: ^19.0.0
    graphiql-explorer>react-dom: ^19.0.0
