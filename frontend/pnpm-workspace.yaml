packages:
  - app
  - packages/schema-visualizer
  - packages/ui
  - packages/graph

# We disallow this to avoid the security risk of running third-party code on install.
allowBuilds:
  core-js: false
  esbuild: false
  msgpackr-extract: false

# Single source of truth for cross-workspace versions. Reference from package.json
# with `"<dep>": "catalog:"`. Add a dep here only if it's used by more than one workspace member.
catalog:
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^26.6.5
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  babel-plugin-react-compiler: ^1.0.0
  lucide-react: ^1.61.0
  react: ^19.3.1
  react-aria-components: ^1.22.1
  react-dom: ^19.3.1
  tailwind-merge: ^3.7.0
  tailwindcss: ^4.3.3
  typescript: ^6.0.3
  vite: ^8.3.5

overrides:
  playwright: 1.60.0
  playwright-core: 1.60.0
  # Security fixes that the parent packages do not accept yet.
  "@betterer/betterer>simple-git": ^4.0.2

auditConfig:
  ignoreGhsas:
    # deepmerge has no fixed release, and only the ultracite CLI uses it, which this project never runs.
    - GHSA-gcqx-w48m-w2h4

peerDependencyRules:
  allowedVersions:
    graphiql-explorer>graphql: ^17.0.0
    graphiql-explorer>react: ^19.0.0
    graphiql-explorer>react-dom: ^19.0.0
    openapi-typescript>typescript: ^6.0.0
