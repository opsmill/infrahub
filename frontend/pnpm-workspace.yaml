# pnpm workspace for the in-repo frontend packages.
# The schema-visualizer is a git submodule (its own repo). It is a workspace member
# for live symlinked dev, but it must keep building standalone from its own repo:
# never use catalog:/workspace: refs inside it — plain semver ranges only.
packages:
  - app
  - packages/schema-visualizer
  - packages/ui

# Single source of truth for cross-workspace versions. Reference from package.json
# with `"<dep>": "catalog:"`. Add a dep here only if it's used by more than one
# workspace member.
catalog:
  "@tailwindcss/vite": ^4.3.0
  "@types/node": ^25.9.2
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  "@vitejs/plugin-react": ^6.0.2
  babel-plugin-react-compiler: ^1.0.0
  lucide-react: ^1.17.0
  react: ^19.2.7
  react-aria-components: ^1.18.0
  react-dom: ^19.2.7
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.0
  typescript: ^5.9.3
  vite: ^8.0.16

overrides:
  playwright: 1.56.1
  playwright-core: 1.56.1

peerDependencyRules:
  allowedVersions:
    graphiql-explorer>graphql: ^16.0.0
    graphiql-explorer>react: ^19.0.0
    graphiql-explorer>react-dom: ^19.0.0
