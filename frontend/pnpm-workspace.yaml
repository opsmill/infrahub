packages:
  - app
  - packages/schema-visualizer
  - packages/ui
  - packages/graph

# We disallow this to avoid the security risk of running third-party code on install.
allowBuilds:
  core-js: false
  esbuild: false
  msgpackr-extract: false

# Single source of truth for cross-workspace versions. Reference from package.json
# with `"<dep>": "catalog:"`. Add a dep here only if it's used by more than one workspace member.
catalog:
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^26.2.0
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.0.5
  babel-plugin-react-compiler: ^1.0.0
  lucide-react: ^1.31.0
  react: ^19.2.8
  react-aria-components: ^1.20.0
  react-dom: ^19.2.8
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  typescript: ^5.9.3
  vite: ^8.3.5

overrides:
  "@fastify/busboy@<3.2.2": ^3.2.2
  "dompurify@<3.4.17": ^3.4.17
  "katex@<0.18.2": 0.18.2
  "markdown-it@<14.3.3": ^14.3.3
  playwright: 1.60.0
  playwright-core: 1.60.0
  "simple-git@<4.0.1": ^4.0.2
  "shell-quote@<1.11.0": ^1.11.0
  "tinypool@<2.1.2": ^2.1.2

peerDependencyRules:
  allowedVersions:
    graphiql-explorer>graphql: ^16.0.0
    graphiql-explorer>react: ^19.0.0
    graphiql-explorer>react-dom: ^19.0.0
