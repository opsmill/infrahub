---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      # gh-aw owns its lock files and .gitattributes byte for byte, down to the
      # trailing spaces in their banner and the missing final newline. Normalising
      # them here only makes the next `gh aw compile` undo it.
      - id: trailing-whitespace
        exclude: ^\.github/workflows/.*\.lock\.yml$
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(schema/schema\.graphql|schema/openapi\.json|\.gitattributes|\.github/workflows/.*\.lock\.yml)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.0
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
