# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v4.3.0"

[[repos.hooks]]
id = "trailing-whitespace"
# Generated GraphQL descriptions and gh-aw lock files preserve whitespace byte for byte.
exclude = '''
(?x)^(
  schema/schema\.graphql|
  \.github/workflows/.*\.lock\.yml
)$
'''

[[repos.hooks]]
id = "check-ast"

[[repos.hooks]]
id = "check-case-conflict"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "check-toml"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "end-of-file-fixer"
# These generators omit final newlines; adding one would fail byte-for-byte validation.
exclude = '''
(?x)^(
  schema/schema\.graphql|
  schema/openapi\.json|
  docs/docs/reference/configuration\.mdx|
  docs/docs/reference/error-catalogue\.mdx|
  frontend/app/src/shared/api/graphql/generated/graphql-env\.d\.ts|
  \.gitattributes|
  \.github/workflows/.*\.lock\.yml
)$
'''

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.0"
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" }
]
