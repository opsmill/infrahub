    title: IP Address Management (hub)
  - path: /ipam/ip-namespaces
    title: IP Namespaces
  - path: /ipam/building-your-schema
    title: Building your IPAM schema
  - path: /ipam/automate-with-resource-manager
    title: Automate with Resource Manager

# Internal cross-link references in OTHER files that point at legacy paths
cross_links_to_update:
  - file: docs/docs/guides/resource-manager.mdx
    line: 1149
    current: ../topics/ipam.mdx
    should_be: ../ipam/
  - file: docs/docs/release-notes/infrahub/release-0_13.mdx
    line: 45
    current: ../../topics/ipam.mdx
    should_be: ../../ipam/
