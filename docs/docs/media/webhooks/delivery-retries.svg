<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">A webhook delivery and its retries</title><desc id="desc">A delivery makes up to four attempts, 120 seconds apart: here a timeout, then HTTP 503, then HTTP 200. Retry on a failed delivery creates a new delivery with the same payload and leaves the original record unchanged.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b4cbd3"/></marker></defs>
<rect width="900" height="420" rx="16" fill="white"/>
<g font-family="Inter, Arial, sans-serif"><rect x="50" y="126" width="120" height="48" rx="24" fill="#f2fcff" stroke="#0B97BB" stroke-width="3"/><text x="110" y="157" text-anchor="middle" font-size="19" font-weight="500" fill="#0B1828">Event</text><path d="M172 150 H840" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3" marker-end="url(#arrow)"/><circle cx="270" cy="150" r="20" fill="white" stroke="#08738f" stroke-width="3"/><path d="M262.4 142.4 L277.6 157.6 M277.6 142.4 L262.4 157.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/><text x="270" y="114" text-anchor="middle" font-size="19" font-weight="500" fill="#0B1828">Attempt 1</text><text x="270" y="200" text-anchor="middle" font-size="18" font-weight="500" fill="#264D59" font-family="Menlo, Consolas, monospace">Timeout</text><circle cx="500" cy="150" r="20" fill="white" stroke="#08738f" stroke-width="3"/><path d="M492.4 142.4 L507.6 157.6 M507.6 142.4 L492.4 157.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/><text x="500" y="114" text-anchor="middle" font-size="19" font-weight="500" fill="#0B1828">Attempt 2</text><text x="500" y="200" text-anchor="middle" font-size="18" font-weight="500" fill="#264D59" font-family="Menlo, Consolas, monospace">503</text><circle cx="730" cy="150" r="20" fill="#08738f"/><path d="M721.6 150 l6.0 6.800000000000001 l12.0 -14.0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="white" stroke-width="3"/><text x="730" y="114" text-anchor="middle" font-size="19" font-weight="500" fill="#0B1828">Attempt 3</text><text x="730" y="200" text-anchor="middle" font-size="18" font-weight="500" fill="#264D59" font-family="Menlo, Consolas, monospace">200</text><g transform="translate(385 120) scale(0.55)"><path d="M0 -18 V0 L12 8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/><circle cx="0" cy="0" r="24" fill="none" stroke="#08738f" stroke-width="3"/></g><text x="385" y="180" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">120 s</text><g transform="translate(615 120) scale(0.55)"><path d="M0 -18 V0 L12 8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/><circle cx="0" cy="0" r="24" fill="none" stroke="#08738f" stroke-width="3"/></g><text x="615" y="180" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">120 s</text><path d="M40 250 H860" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b4cbd3" stroke-width="1.5"/><circle cx="150" cy="345" r="20" fill="white" stroke="#08738f" stroke-width="3"/><path d="M142.4 337.4 L157.6 352.6 M157.6 337.4 L142.4 352.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/><text x="150" y="395" text-anchor="middle" font-size="18" font-weight="500" fill="#0B1828">Failed delivery</text><path d="M182 345 H420" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3" marker-end="url(#arrow)"/><text x="300" y="329" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Retry</text><circle cx="452" cy="345" r="20" fill="#08738f"/><path d="M443.6 345 l6.0 6.800000000000001 l12.0 -14.0" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="white" stroke-width="3"/><text x="452" y="395" text-anchor="middle" font-size="18" font-weight="500" fill="#0B1828">New delivery</text><text x="560" y="337" text-anchor="start" font-size="18" font-weight="500" fill="#264D59">Same payload</text><text x="560" y="367" text-anchor="start" font-size="18" font-weight="500" fill="#264D59">Original record unchanged</text></g></svg>
