<title id="title">Generate infrastructure data and separate configurations</title><desc id="desc">A site design feeds a Generator that creates firewall, switch, and monitoring objects in Infrahub. Transformations read this data and produce separate firewall, switch, and monitoring configuration artifacts for external deployment automation.</desc>
