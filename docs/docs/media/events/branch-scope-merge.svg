<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Branch scope and the events a merge emits</title><desc id="desc">An edit on the default branch, an edit on a branch, and the event the merge emits again on the default branch for that same change. Default Branch matches the first and third, Other Branches matches the second, and All Branches matches all three, so it acts twice on the branch change.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b4cbd3"/></marker></defs>
<rect width="900" height="470" rx="16" fill="white"/>
<g font-family="Inter, Arial, sans-serif"><text x="40" y="127" text-anchor="start" font-size="20" font-weight="500" fill="#0B1828">Default branch</text><path d="M240 120 H860" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="4" marker-end="url(#arrow)"/><path d="M390 120 C440 120 420 225 490 225 H640 C700 225 675 120 735 120" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#0B97BB" stroke-width="4" marker-end="url(#arrow)"/><text x="40" y="232" text-anchor="start" font-size="20" font-weight="500" fill="#0B97BB">Branch</text><text x="712" y="178" text-anchor="start" font-size="18" font-weight="500" fill="#08738f">Merge</text><circle cx="320" cy="120" r="12" fill="#0B97BB" stroke="white" stroke-width="3"/><circle cx="550" cy="225" r="12" fill="#0B97BB" stroke="white" stroke-width="3"/><circle cx="775" cy="120" r="12" fill="#0B97BB" stroke="white" stroke-width="3"/><text x="320" y="96" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Edit</text><text x="550" y="201" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Edit</text><text x="775" y="96" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Same change again</text><path d="M320 138 V438" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b4cbd3" stroke-width="1.5" stroke-dasharray="8 8"/><path d="M550 243 V438" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b4cbd3" stroke-width="1.5" stroke-dasharray="8 8"/><path d="M775 138 V438" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b4cbd3" stroke-width="1.5" stroke-dasharray="8 8"/><text x="40" y="282" text-anchor="start" font-size="17" font-weight="500" fill="#264D59">Branch scope</text><text x="40" y="327" text-anchor="start" font-size="19" font-weight="600" fill="#0B1828">Default Branch</text><circle cx="320" cy="320" r="17" fill="#08738f"/><path d="M312.86 320 l5.1 5.78 l10.2 -11.899999999999999" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="white" stroke-width="3"/><circle cx="550" cy="320" r="17" fill="white" stroke="#b4cbd3" stroke-width="2"/><path d="M543.2 320 H556.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b4cbd3" stroke-width="2"/><circle cx="775" cy="320" r="17" fill="#08738f"/><path d="M767.86 320 l5.1 5.78 l10.2 -11.899999999999999" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="white" stroke-width="3"/><text x="40" y="383" text-anchor="start" font-size="19" font-weight="600" fill="#0B1828">Other Branches</text><circle cx="320" cy="376" r="17" fill="white" stroke="#b4cbd3" stroke-width="2"/><path d="M313.2 376 H326.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b4cbd3" stroke-width="2"/><circle cx="550" cy="376" r="17" fill="#08738f"/><path d="M542.86 376 l5.1 5.78 l10.2 -11.899999999999999" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="white" stroke-width="3"/><circle cx="775" cy="376" r="17" fill="white" stroke="#b4cbd3" stroke-width="2"/><path d="M768.2 376 H781.8" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b4cbd3" stroke-width="2"/><text x="40" y="439" text-anchor="start" font-size="19" font-weight="600" fill="#0B1828">All Branches</text><circle cx="320" cy="432" r="17" fill="#08738f"/><path d="M312.86 432 l5.1 5.78 l10.2 -11.899999999999999" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="white" stroke-width="3"/><circle cx="550" cy="432" r="17" fill="#08738f"/><path d="M542.86 432 l5.1 5.78 l10.2 -11.899999999999999" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="white" stroke-width="3"/><circle cx="775" cy="432" r="17" fill="#08738f"/><path d="M767.86 432 l5.1 5.78 l10.2 -11.899999999999999" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="white" stroke-width="3"/></g></svg>
