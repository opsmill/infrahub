<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">A chain of rules that runs a Generator</title><desc id="desc">A node rule matches a new circuit and adds it to the group provisioning_circuits, the Generator definition's target group. A group rule matches the new member and runs the Generator, which creates the endpoints. A Generator action on a node rule fails for a circuit that is not a member of the target group.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b4cbd3"/></marker></defs>
<rect width="900" height="440" rx="16" fill="white"/>
<g font-family="Inter, Arial, sans-serif"><g transform="translate(80 150) scale(0.9)"><path d="M-42 0 H-15 M15 0 H42 M-15 -14 H15 V14 H-15 Z" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/><circle cx="-43" cy="0" r="5" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="43" cy="0" r="5" fill="white" stroke="#08738f" stroke-width="3"/></g><text x="80" y="202" text-anchor="middle" font-size="20" font-weight="500" fill="#0B1828">Circuit</text><path d="M128 150 H196" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3" marker-end="url(#arrow)"/><text x="162" y="134" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Create</text><g transform="translate(230 150) scale(0.75)"><path d="M-26 -20 H26 L7 4 V22 L-7 14 V4 Z" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/></g><text x="230" y="202" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Node rule</text><path d="M262 150 H370" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3" marker-end="url(#arrow)"/><text x="316" y="134" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Add member</text><circle cx="430" cy="150" r="58" fill="#f2fcff"/><g transform="translate(430 150) scale(0.9)"><rect x="-50" y="-38" width="100" height="76" rx="14" fill="white" stroke="#08738f" stroke-width="3" stroke-dasharray="7 7"/><circle cx="-22" cy="-12" r="9" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="2" cy="14" r="9" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="24" cy="-10" r="9" fill="white" stroke="#08738f" stroke-width="3"/></g><text x="430" y="88" text-anchor="middle" font-size="18" font-weight="500" fill="#0B1828" font-family="Menlo, Consolas, monospace">provisioning_circuits</text><text x="430" y="226" text-anchor="middle" font-size="17" font-weight="500" fill="#264D59">Generator target group</text><path d="M488 150 H560" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3" marker-end="url(#arrow)"/><g transform="translate(594 150) scale(0.75)"><path d="M-26 -20 H26 L7 4 V22 L-7 14 V4 Z" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/></g><text x="594" y="202" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Group rule</text><path d="M626 150 H738" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3" marker-end="url(#arrow)"/><text x="682" y="134" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Run Generator</text><g transform="translate(800 146) scale(0.8)"><path d="M0 0 L-44 -30 M0 0 L44 -30 M0 0 L0 48" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/><circle cx="0" cy="0" r="12" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="-44" cy="-30" r="12" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="44" cy="-30" r="12" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="0" cy="48" r="12" fill="white" stroke="#08738f" stroke-width="3"/></g><text x="800" y="212" text-anchor="middle" font-size="20" font-weight="500" fill="#0B1828">Endpoints</text><path d="M40 262 H860" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b4cbd3" stroke-width="1.5"/><g transform="translate(80 360) scale(0.9)"><path d="M-42 0 H-15 M15 0 H42 M-15 -14 H15 V14 H-15 Z" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/><circle cx="-43" cy="0" r="5" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="43" cy="0" r="5" fill="white" stroke="#08738f" stroke-width="3"/></g><text x="80" y="412" text-anchor="middle" font-size="20" font-weight="500" fill="#0B1828">Circuit</text><path d="M128 360 H196" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3" marker-end="url(#arrow)"/><text x="162" y="344" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Create</text><g transform="translate(230 360) scale(0.75)"><path d="M-26 -20 H26 L7 4 V22 L-7 14 V4 Z" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/></g><text x="230" y="412" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Node rule</text><path d="M262 360 H560" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#b4cbd3" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow-muted)"/><text x="411" y="344" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Run Generator</text><circle cx="594" cy="360" r="20" fill="white" stroke="#08738f" stroke-width="3"/><path d="M586.4 352.4 L601.6 367.6 M601.6 352.4 L586.4 367.6" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke="#08738f" stroke-width="3"/><text x="594" y="412" text-anchor="middle" font-size="18" font-weight="500" fill="#0B1828">Fail</text><text x="632" y="367" text-anchor="start" font-size="18" font-weight="500" fill="#264D59">Not in the target group</text></g></svg>
