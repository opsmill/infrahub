<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490" role="img" aria-labelledby="title desc">
<title id="title">One event, several consumers</title><desc id="desc">Updating the device atl1-edge1 emits the event infrahub.node.updated. The activity log records it, a rule can match it and run an action inside Infrahub, a webhook sends it to an HTTP endpoint, and Enterprise log forwarding sends it to a SIEM.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker><marker id="arrow-muted" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b4cbd3"/></marker></defs>
<rect width="900" height="490" rx="16" fill="white"/>
