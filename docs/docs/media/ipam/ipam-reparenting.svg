<svg xmlns="http://www.w3.org/2000/svg" width="900" height="345" viewBox="0 0 900 345" role="img" aria-labelledby="title desc">
<title id="title">Infrahub updates the prefix tree</title><desc id="desc">Creating 10.0.0.0/17 inside 10.0.0.0/16 moves 10.0.0.0/24 and 10.0.1.0/24 under the new prefix, and 10.0.128.0/24 stays under 10.0.0.0/16. Deleting 10.0.0.0/17 moves the two prefixes back under 10.0.0.0/16.</desc>
