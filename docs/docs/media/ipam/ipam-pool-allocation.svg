<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
<title id="title">Allocation from a pool, with an identifier</title><desc id="desc">A loopback pool uses the prefix 10.0.0.0/24 as its resource. The network address 10.0.0.0 is not allocated. A Generator requests an address with the identifier atl1-edge1 and receives 10.0.0.1/32, then with atl1-edge2 and receives 10.0.0.2/32. Requesting again with atl1-edge1 returns 10.0.0.1/32 again instead of allocating a new address.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker></defs>
<rect width="900" height="470" rx="16" fill="white"/>
