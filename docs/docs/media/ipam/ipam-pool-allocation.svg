4D59">.7</text><rect x="579" y="111" width="58" height="34" rx="6" fill="white" stroke="#08738f" stroke-width="2"/><text x="608.0" y="134" text-anchor="middle" font-size="16" font-weight="500" fill="#264D59">.8</text><rect x="643" y="111" width="58" height="34" rx="6" fill="white" stroke="#08738f" stroke-width="2"/><text x="672.0" y="134" text-anchor="middle" font-size="16" font-weight="500" fill="#264D59">.9</text><rect x="707" y="111" width="58" height="34" rx="6" fill="white" stroke="#08738f" stroke-width="2"/><text x="736.0" y="134" text-anchor="middle" font-size="16" font-weight="500" fill="#264D59">.10</text><text x="800.0" y="134" text-anchor="middle" font-size="18" font-weight="500" fill="#264D59">…</text><path d="M160.0 150 V160" fill="none" stroke="#08738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="160.0" y="178" text-anchor="middle" font-size="15" font-weight="500" fill="#08738f">atl1-edge1</text><path d="M224.0 150 V184" fill="none" stroke="#08738f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="224.0" y="202" text-anchor="middle" font-size="15" font-weight="500" fill="#08738f">atl1-edge2</text><path d="M96.0 150 V184" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="96.0" y="202" text-anchor="middle" font-size="15" font-weight="500" fill="#264D59">network</text><path d="M259 158 V166 H765 V158" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="512.0" y="186" text-anchor="middle" font-size="15" font-weight="500" fill="#264D59">free</text><text x="40" y="250" text-anchor="start" font-size="17" font-weight="500" fill="#264D59">Requests from a Generator</text><rect x="40" y="268" width="270" height="44" rx="22.0" fill="white" stroke="#08738f" stroke-width="3"/><text x="175.0" y="296.3" text-anchor="middle" font-size="18" font-weight="500" fill="#0B1828">identifier: atl1-edge1</text><path d="M32