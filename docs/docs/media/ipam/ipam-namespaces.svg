<title id="title">The same address space in three namespaces</title><desc id="desc">The namespaces customer-a, customer-b and customer-c each hold 10.0.0.0/8, 10.1.0.0/16 and the address 10.1.0.1/16 without conflict. Each namespace also holds a different second /16.</desc>
