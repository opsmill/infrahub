<title id="title">Utilization depends on the member type</title><desc id="desc">192.0.2.0/24 with member type prefix holds one /26: utilization 25%. 192.0.2.0/26 with member type address holds 20 of 62 usable addresses, excluding the network and broadcast addresses: utilization 32%. 10.0.0.0/22 with member type address holds three /24 prefixes and no addresses: utilization 0%.</desc>
