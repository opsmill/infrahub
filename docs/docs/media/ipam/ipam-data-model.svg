<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">IP data organized by namespace and containment</title><desc id="desc">The default namespace contains the prefix 10.0.0.0/16, which contains 10.0.0.0/24 and 10.0.1.0/24. Each address belongs to the most specific prefix that contains it. The address 10.0.1.10/24 is assigned to the device atl1-edge1.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker></defs>
<rect width="900" height="480" rx="16" fill="white"/>
