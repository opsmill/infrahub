 height="44" rx="7" fill="white" stroke="#08738f" stroke-width="3"/><path d="M-28 -5 v10" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-10 -5 v10" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 -5 v10" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="0" r="4" fill="#0B97BB"/></g><text x="775" y="442" text-anchor="middle" font-size="21" font-weight="500" fill="#0B1828">atl1-edge1</text><rect x="58" y="412" width="34" height="18" rx="9" fill="white" stroke="#08738f" stroke-width="2"/><text x="102" y="427" text-anchor="start" font-size="17" font-weight="500" fill="#264D59">Prefix</text><circle cx="182" cy="421" r="7" fill="#0B97BB"/><text x="196" y="427" text-anchor="start" font-size="17" font-weight="500" fill="#264D59">Address</text></g></svg>
