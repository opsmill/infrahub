<svg xmlns="http://www.w3.org/2000/svg" width="900" height="375" viewBox="0 0 900 375" role="img" aria-labelledby="title desc">
<title id="title">The prefix tree on a branch and after the merge</title><desc id="desc">On the customer-a-subnet-split branch, creating 10.1.0.0/17 updates the branch's prefix tree right away. When the branch is merged, Infrahub updates the tree on the default branch for the prefixes and addresses that changed.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker></defs>
<rect width="900" height="375" rx="16" fill="white"/>
<g font-family="Inter, Arial, sans-serif"><g transform="translate(0 -45)"><text x="125" y="112" text-anchor="middle" font-size="22" font-weight="500" fill="#0B1828">Default branch</text><path d="M90 140 H815" fill="none" stroke="#08738f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M210 140 C260 140 240 260 310 260 H625 C690 260 660 140 725 140" fill="none" stroke="#0B97BB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="130" cy="140" r="9" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="210" cy="140" r="9" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="725" cy="140" r="9" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="360" cy="260" r="10" fill="white" stroke="#0B97BB" stroke-width="3"/><circle cx="540" cy="260" r="10" fill="white" stroke="#0B97BB" stroke-width="3"/><text x="450" y="230" text-anchor="middle" font-size="22" font-weight="500" fill="#08738f">customer-a-subnet-split</text><rect x="255" y="292" width="210" height="40" rx="20.0" fill="white" stroke="#08738f" stroke-width="3"/><text x="360.0" y="318.3" text-anchor="middle" font-size="18" font-weight="500" fill="#0B1828">Create 10.1.0.0/17</text><circle cx="540" cy="325" r="40" fill="#f2fcff"/><g transform="translate(540 325)"><rect x="-24" y="-22" width="30" height="12" rx="6" fill="white" stroke="#08738f" stroke-width="2.5"/><path d="M-16 -10 V16 M-16 2 H-6 M-16 16 H-6" fill="none" stroke="#08738f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-4" width="30" height="12" rx="6" fill="white" stroke="#0B97BB" stroke-width="2.5"/><rect x="-6" y="10" width="30" height="12" rx="6" fill="white" stroke="#0B97BB" stroke-width="2.5"/></g><text x="540" y="390" text-anchor="middle" font-size="19" font-weight="500" fill="#0B1828">Tree updated</text><text x="725" y="112" text-anchor="middle" font-size="22" font-weight="500" fill="#0B1828">Merge</text><path d="M734 150 L770 184" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="800" cy="215" r="40" fill="#f2fcff"/><g transform="translate(800 215)"><rect x="-24" y="-22" width="30" height="12" rx="6" fill="white" stroke="#08738f" stroke-width="2.5"/><path d="M-16 -10 V16 M-16 2 H-6 M-16 16 H-6" fill="none" stroke="#08738f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="-6" y="-4" width="30" height="12" rx="6" fill="white" stroke="#0B97BB" stroke-width="2.5"/><rect x="-6" y="10" width="30" height="12" rx="6" fill="white" stroke="#0B97BB" stroke-width="2.5"/></g><text x="800" y="280" text-anchor="middle" font-size="19" font-weight="500" fill="#0B1828">Tree updated</text></g></g></svg>
