necap="round" stroke-linejoin="round"/><text x="220" y="402" text-anchor="middle" font-size="18" font-weight="500" fill="#0B1828">Fail</text><circle cx="680" cy="205" r="62" fill="#f2fcff" stroke="none" stroke-width="3"/><g transform="translate(680 205) scale(1)"><path d="M-34 28 V-24 H12 V28 M12 -8 H34 V28 M-42 28 H42 M-12 28 V10 H0 V28" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-22 -12 h5" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-22 0 h5" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2 -12 h5" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-2 0 h5" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="680" y="302" text-anchor="middle" font-size="21" font-weight="500" fill="#0B1828">Site</text><path d="M655 147 L610 105" fill="none" stroke="#0B97BB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(590 85) scale(0.6)"><path d="M-42 0 H-15 M15 0 H42 M-15 -14 H15 V14 H-15 Z" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-43" cy="0" r="5" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="43" cy="0" r="5" fill="white" stroke="#08738f" stroke-width="3"/></g><path d="M705 147 L750 105" fill="none" stroke="#0B97BB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(770 85) scale(0.6)"><path d="M-42 0 H-15 M15 0 H42 M-15 -14 H15 V14 H-15 Z" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-43" cy="0" r="5" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="43" cy="0" r="5" fill="white" stroke="#08738f" stroke-width="3"/></g><circle cx="680" cy="353" r="22" fill="#08738f" stroke="none" stroke-width="3"/><path d="M671 353 l6 7 l13 -15" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="680" y="402" text-anchor="middle" font-size="18" font-weight="500" fill="#0B1828">Pass</text><path d="M350 220 H550" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="450" y="193" text-anchor="middle" font-size="20" font-weight="500" fill="#08738f">Add circuit</text><text x="450" y="254" text-anchor="middle" font-size="18" font-weight="500" fill="#264D59">Rerun check</text></g></svg>
