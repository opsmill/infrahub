<svg xmlns="http://www.w3.org/2000/svg" width="900" height="425" viewBox="0 0 900 425" role="img" aria-labelledby="title desc">
<title id="title">Validate the site design</title><desc id="desc">A site with one WAN circuit fails the two-circuit rule. Add the missing circuit and rerun the check: the same site now passes.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker></defs>
<rect width="900" height="425" rx="16" fill="white"/>
