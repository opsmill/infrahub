<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" role="img" class="promo-rw">
  <title>Three Infrahub instances, development, integration and production, above one Git repository. A feature branch syncs between Git and the development instance. A reviewer merges its Proposed Change on development, and Infrahub pushes the merge to the Git branch develop. A user creates a promotion branch from develop in Git, and the integration instance imports it. A reviewer merges its Proposed Change on integration, and Infrahub pushes the merge to the Git branch integration. The same steps repeat from integration to production.</title>
  <style>
    /* Each var() has a light-theme fallback because the docs build inlines and drops a rule that only sets custom properties. */
    [data-theme='dark'] .promo-rw { --fg:#f3f1fb; --bg:#1b1b1d; --tint:#242526; --line:#4a3f80; --muted:#aea8cc; --accent:#9bb8ea; --on-accent:#130d30; --git:#63cdd4; --git-fill:#12303c; }
    .promo-rw text { font-family: Inter, Arial, system-ui, sans-serif; fill: var(--fg, #231556); }
    .promo-rw .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
    .promo-rw .small { font-size: 11px; fill: var(--muted, #5f5a7a); }
    .promo-rw .name { font-size: 20px; font-weight: 700; }
    .promo-rw .inst { fill: var(--tint, #f6f5fa); stroke: var(--line, #cfcbe0); stroke-width: 1.5; }
    .promo-rw .repo { fill: var(--git-fill, #eaf8f9); stroke: var(--git, #1f8f97); stroke-width: 1.5; }
    .promo-rw .box { fill: var(--bg, #ffffff); stroke: var(--line, #cfcbe0); stroke-width: 1.25; }
    .promo-rw .review { fill: var(--accent, #426db1); stroke: var(--accent, #426db1); }
    .promo-rw .on-review { fill: var(--on-accent, #ffffff); }
    .promo-rw .pill { fill: var(--bg, #ffffff); stroke: var(--git, #1f8f97); stroke-width: 1.25; }
    .promo-rw .long { stroke-width: 2.5; }
    .promo-rw .flow { fill: none; stroke: var(--fg, #231556); stroke-width: 1.75; }
    .promo-rw .head { fill: var(--fg, #231556); }
    .promo-rw .num { fill: var(--fg, #231556); }
    .promo-rw .num-t { fill: var(--bg, #ffffff); font-size: 13px; font-weight: 700; }
    .promo-rw .step { transition: opacity 160ms ease-out; }
    .promo-rw:has(.s1:hover) .step:not(.s1),
    .promo-rw:has(.s2:hover) .step:not(.s2),
    .promo-rw:has(.s3:hover) .step:not(.s3),
    .promo-rw:has(.s4:hover) .step:not(.s4),
    .promo-rw:has(.s5:hover) .step:not(.s5) { opacity: 0.2; }
    @media (prefers-reduced-motion: reduce) { .promo-rw .step { transition: none; } }
  </style>
  <defs>
    <marker id="promo-rw-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>

  <rect class="inst" x="15" y="20" width="330" height="250" rx="12"/>
  <rect class="inst" x="385" y="20" width="330" height="250" rx="12"/>
  <rect class="inst" x="755" y="20" width="330" height="250" rx="12"/>
  <rect class="repo" x="15" y="330" width="1070" height="140" rx="12"/>

  <text class="name" x="35" y="54">development</text>
  <text class="mono small" x="35" y="74">imports feature/.*</text>
  <text class="name" x="405" y="54">integration</text>
  <text class="mono small" x="405" y="74">imports promote/integration/.*</text>
  <text class="name" x="775" y="54">production</text>
  <text class="mono small" x="775" y="74">imports promote/production/.*</text>
  <text class="name" x="35" y="362">Git</text>
  <text class="small" x="78" y="362">one repository</text>

  <g class="step s1">
    <rect class="pill" x="25" y="400" width="170" height="32" rx="16"/>
    <text class="mono" x="110" y="420" font-size="12" text-anchor="middle">feature/x</text>
    <path class="flow" d="M110 398 V242" marker-start="url(#promo-rw-arr)" marker-end="url(#promo-rw-arr)"/>
    <rect class="box" x="25" y="196" width="170" height="44" rx="6"/>
    <text x="110" y="215" font-size="12.5" font-weight="600" text-anchor="middle">Branch</text>
    <text class="mono small" x="110" y="231" text-anchor="middle">feature/x</text>
    <circle class="num" cx="110" cy="300" r="12"/><text class="num-t" x="110" y="304.5" text-anchor="middle">1</text>
    <text class="small" x="128" y="304">sync, either way</text>
  </g>

  <g class="step s2">
    <path class="flow" d="M110 196 V142" marker-end="url(#promo-rw-arr)"/>
    <rect class="box review" x="35" y="96" width="150" height="44" rx="6"/>
    <text class="on-review" x="110" y="115" font-size="12.5" font-weight="600" text-anchor="middle">Proposed Change</text>
    <text class="on-review" x="110" y="131" font-size="11" text-anchor="middle">a reviewer merges</text>
    <path class="flow" d="M185 118 H218" marker-end="url(#promo-rw-arr)"/>
    <rect class="box" x="220" y="96" width="100" height="44" rx="6"/>
    <text x="270" y="115" font-size="12.5" font-weight="600" text-anchor="middle">main</text>
    <text class="small" x="270" y="131" text-anchor="middle">Git develop</text>
    <path class="flow" d="M270 140 V398" marker-end="url(#promo-rw-arr)"/>
    <rect class="pill long" x="215" y="400" width="110" height="32" rx="16"/>
    <text class="mono" x="270" y="420" font-size="12" font-weight="500" text-anchor="middle">develop</text>
    <circle class="num" cx="270" cy="300" r="12"/><text class="num-t" x="270" y="304.5" text-anchor="middle">2</text>
    <text class="small" x="288" y="304">merge, push</text>
  </g>

  <g class="step s3">
    <path class="flow" d="M327 416 H393" marker-end="url(#promo-rw-arr)"/>
    <rect class="pill" x="395" y="400" width="170" height="32" rx="16"/>
    <text class="mono" x="480" y="420" font-size="12" text-anchor="middle">promote/integration/7</text>
    <circle class="num" cx="360" cy="388" r="12"/><text class="num-t" x="360" y="392.5" text-anchor="middle">3</text>
    <text class="small" x="360" y="450" text-anchor="middle">branch from develop</text>
  </g>

  <g class="step s4">
    <path class="flow" d="M480 398 V242" marker-end="url(#promo-rw-arr)"/>
    <rect class="box" x="395" y="196" width="170" height="44" rx="6"/>
    <text x="480" y="215" font-size="12.5" font-weight="600" text-anchor="middle">Branch</text>
    <text class="mono small" x="480" y="231" text-anchor="middle">promote/integration/7</text>
    <circle class="num" cx="480" cy="300" r="12"/><text class="num-t" x="480" y="304.5" text-anchor="middle">4</text>
    <text class="small" x="498" y="304">import</text>
  </g>

  <g class="step s5">
    <path class="flow" d="M480 196 V142" marker-end="url(#promo-rw-arr)"/>
    <rect class="box review" x="405" y="96" width="150" height="44" rx="6"/>
    <text class="on-review" x="480" y="115" font-size="12.5" font-weight="600" text-anchor="middle">Proposed Change</text>
    <text class="on-review" x="480" y="131" font-size="11" text-anchor="middle">a reviewer merges</text>
    <path class="flow" d="M555 118 H588" marker-end="url(#promo-rw-arr)"/>
    <rect class="box" x="590" y="96" width="100" height="44" rx="6"/>
    <text x="640" y="115" font-size="12.5" font-weight="600" text-anchor="middle">main</text>
    <text class="small" x="640" y="131" text-anchor="middle">Git integration</text>
    <path class="flow" d="M640 140 V398" marker-end="url(#promo-rw-arr)"/>
    <rect class="pill long" x="585" y="400" width="110" height="32" rx="16"/>
    <text class="mono" x="640" y="420" font-size="12" font-weight="500" text-anchor="middle">integration</text>
    <circle class="num" cx="640" cy="300" r="12"/><text class="num-t" x="640" y="304.5" text-anchor="middle">5</text>
    <text class="small" x="658" y="304">merge, push</text>
  </g>

  <g class="step s3">
    <path class="flow" d="M697 416 H763" marker-end="url(#promo-rw-arr)"/>
    <rect class="pill" x="765" y="400" width="170" height="32" rx="16"/>
    <text class="mono" x="850" y="420" font-size="12" text-anchor="middle">promote/production/3</text>
    <circle class="num" cx="730" cy="388" r="12"/><text class="num-t" x="730" y="392.5" text-anchor="middle">3</text>
    <text class="small" x="730" y="450" text-anchor="middle">branch from integration</text>
  </g>
  <g class="step s4">
    <path class="flow" d="M850 398 V242" marker-end="url(#promo-rw-arr)"/>
    <rect class="box" x="765" y="196" width="170" height="44" rx="6"/>
    <text x="850" y="215" font-size="12.5" font-weight="600" text-anchor="middle">Branch</text>
    <text class="mono small" x="850" y="231" text-anchor="middle">promote/production/3</text>
    <circle class="num" cx="850" cy="300" r="12"/><text class="num-t" x="850" y="304.5" text-anchor="middle">4</text>
    <text class="small" x="868" y="304">import</text>
  </g>
  <g class="step s5">
    <path class="flow" d="M850 196 V142" marker-end="url(#promo-rw-arr)"/>
    <rect class="box review" x="775" y="96" width="150" height="44" rx="6"/>
    <text class="on-review" x="850" y="115" font-size="12.5" font-weight="600" text-anchor="middle">Proposed Change</text>
    <text class="on-review" x="850" y="131" font-size="11" text-anchor="middle">a reviewer merges</text>
    <path class="flow" d="M925 118 H958" marker-end="url(#promo-rw-arr)"/>
    <rect class="box" x="960" y="96" width="100" height="44" rx="6"/>
    <text x="1010" y="115" font-size="12.5" font-weight="600" text-anchor="middle">main</text>
    <text class="small" x="1010" y="131" text-anchor="middle">Git production</text>
    <path class="flow" d="M1010 140 V398" marker-end="url(#promo-rw-arr)"/>
    <rect class="pill long" x="955" y="400" width="110" height="32" rx="16"/>
    <text class="mono" x="1010" y="420" font-size="12" font-weight="500" text-anchor="middle">production</text>
    <circle class="num" cx="1010" cy="300" r="12"/><text class="num-t" x="1010" y="304.5" text-anchor="middle">5</text>
    <text class="small" x="1028" y="304">merge, push</text>
  </g>
</svg>
