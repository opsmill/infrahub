<svg xmlns="http://www.w3.org/2000/svg" width="900" height="575" viewBox="0 0 900 575" role="img" aria-labelledby="title desc">
<title id="title">Import automation from a Git repository</title><desc id="desc">An example automation repository contains the .infrahub.yml manifest and separate schema, queries, generators, transformations, and checks subdirectories. The manifest declares the definitions imported into an Infrahub branch, where they operate on infrastructure data. Standard repositories sync automatically; read-only imports require an explicit request.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#08738f"/></marker></defs>
<rect width="900" height="575" rx="16" fill="white"/>
<g font-family="Inter, Arial, sans-serif"><text x="230" y="49" text-anchor="middle" font-size="25" font-weight="500" fill="#0B1828">Git repository</text><text x="690" y="49" text-anchor="middle" font-size="25" font-weight="500" fill="#0B1828">Infrahub branch</text><g transform="translate(90 105) scale(0.65)"><path d="M-40 27 V-28 H-8 L3 -16 H40 V27 Z" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="235" y="111" text-anchor="middle" font-size="22" font-weight="500" fill="#0B1828">automation/</text><path d="M90 126 V440" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M90 165 H125" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(147 165) scale(0.38)"><path d="M-27 -36 H12 L29 -19 V36 H-27 Z M12 -36 V-19 H29 M-15 -3 H15 M-15 9 H15 M-15 21 H7" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="178" y="172" font-size="21" fill="#08738f">.infrahub.yml</text><path d="M90 220 H125" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(147 220) scale(0.38)"><path d="M-40 27 V-28 H-8 L3 -16 H40 V27 Z" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="178" y="227" font-size="21" fill="#0B1828">schema/</text><path d="M90 275 H125" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(147 275) scale(0.38)"><path d="M-40 27 V-28 H-8 L3 -16 H40 V27 Z" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="178" y="282" font-size="21" fill="#0B1828">queries/</text><path d="M90 330 H125" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(147 330) scale(0.38)"><path d="M-40 27 V-28 H-8 L3 -16 H40 V27 Z" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="178" y="337" font-size="21" fill="#0B1828">generators/</text><path d="M90 385 H125" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(147 385) scale(0.38)"><path d="M-40 27 V-28 H-8 L3 -16 H40 V27 Z" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="178" y="392" font-size="21" fill="#0B1828">transformations/</text><path d="M90 440 H125" fill="none" stroke="#b4cbd3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(147 440) scale(0.38)"><path d="M-40 27 V-28 H-8 L3 -16 H40 V27 Z" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="178" y="447" font-size="21" fill="#0B1828">checks/</text><path d="M425 260 H568" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="495" y="233" text-anchor="middle" font-size="20" font-weight="500" fill="#08738f">Import</text><circle cx="690" cy="210" r="60" fill="#f2fcff" stroke="none" stroke-width="3"/><g transform="translate(690 210) scale(1)"><path d="M-15 -17 L-33 0 L-15 17 M15 -17 L33 0 L15 17 M6 -26 L-6 26" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><text x="690" y="303" text-anchor="middle" font-size="22" font-weight="500" fill="#0B1828">Definitions</text><path d="M690 325 V356" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g transform="translate(690 410) scale(0.85)"><path d="M0 0 L-44 -30 M0 0 L44 -30 M0 0 L0 48" fill="none" stroke="#08738f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="0" cy="0" r="12" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="-44" cy="-30" r="12" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="44" cy="-30" r="12" fill="white" stroke="#08738f" stroke-width="3"/><circle cx="0" cy="48" r="12" fill="white" stroke="#08738f" stroke-width="3"/></g><text x="690" y="502" text-anchor="middle" font-size="22" font-weight="500" fill="#0B1828">Infrastructure data</text><text x="235" y="511" text-anchor="middle" font-size="18" font-weight="500" fill="#08738f">Standard: automatic sync</text><text x="235" y="546" text-anchor="middle" font-size="18" font-weight="500" fill="#264D59">Read-only: request an import</text></g></svg>
