<svg xmlns="http://www.w3.org/2000/svg" width="900" height="435" viewBox="0 0 900 435" role="img" aria-labelledby="title desc">
<title id="title">Connected infrastructure data</title><desc id="desc">A site contains a device with name and status attributes. The device uses a circuit. The service depends on that circuit, as shown by the arrow from service to circuit.</desc>
