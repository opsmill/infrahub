[pytest]
# Dedicated config for the pytest-playwright e2e suite so it does NOT inherit
# the root [tool.pytest.ini_options] (coverage, xdist loadscope, asyncio auto,
# the global 300s timeout, etc). Always run with:
#     uv run pytest -c tests/e2e/pytest.ini tests/e2e
addopts =
    --browser chromium
    --tracing retain-on-failure
    --video retain-on-failure
    --screenshot only-on-failure
    --output test-results
    --junitxml playwright-junit.xml
    --maxfail 5
    -ra
# No per-test pytest-timeout: the first data-dependent test triggers the
# (multi-minute) one-off dataset load during fixture setup; Playwright's own
# action/expect timeouts guard individual interactions and the CI job has a
# 60-minute ceiling.
console_output_style = count
