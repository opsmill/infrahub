[project]
name = "infrahub-testcontainers"
version = "1.8.1"
requires-python = ">=3.10"

description = "Testcontainers instance for Infrahub to easily build integration tests"
authors = [{ name = "OpsMill", email = "info@opsmill.com" }]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "testcontainers>=4.8,<4.9",
    "psutil",
    "pytest",
    "httpx>=0.20",
    "pydantic>=2.10.6,<3",
    "prefect-client==3.6.13",
]

[project.urls]
Homepage = "https://opsmill.com"
Repository = "https://github.com/opsmill/infrahub"

[project.entry-points.pytest11]
pytest-infrahub-performance-test = "infrahub_testcontainers.plugin"

[dependency-groups]
dev = [
    "rich>=13.9.4,<14",
    "pytest-cov==7.0.0",
    "pytest-xdist>=3.4,<3.5",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
preview = true


select = ["ALL"]

ignore = [
    "D",        # pydocstyle
    "DOC",      # pydoclint
    "CPY",      # flake8-copyright
    "T201",     # use of `print`
    "ISC",      # flake8-implicit-str-concat
    "COM812",   # missing-trailing-comma
    "S101",     # Use of assert allowed as the producation code is used within tests
    ##################################################################################################
    # Rules below needs to be Investigated                                                           #
    ##################################################################################################
    "A001",     # Variable `format` is shadowing a Python builtin
    "BLE001",   # Do not catch blind exception: `Exception`
    "C901",     # `database_restore_backup` is too complex (22 > 10)
    "E501",     # Line too long
    "EM101",    # Exception must not use a string literal, assign to variable first
    "EM102",    # Exception must not use an f-string literal, assign to variable first
    "FBT001",   # Boolean-typed positional argument in function definition
    "FBT002",   # Boolean default positional argument in function definition
    "FIX002",   # Line contains TODO, consider resolving the issue
    "I001",     # [*] Import block is un-sorted or un-formatted
    "PERF203",  # `try`-`except` within a loop incurs performance overhead
    "PGH003",   # Use specific rule codes when ignoring type issues
    "PLR0912",  # Too many branches
    "PLR0914",  # Too many local variables
    "PLR6301",  # Method `infrahub_app` could be a function, class method, or static method
    "PT021",    # Use `yield` instead of `request.addfinalizer`
    "RET504",   # Unnecessary assignment to `result` before `return` statement
    "RUF010",   # Use explicit conversion flag
    "RUF067",   # `__init__` module should only contain docstrings and re-exports
    "RUF100",   # [*] Unused `noqa` directive (non-enabled: `E501`)
    "UP035",    # [*] Import from `collections.abc` instead: `Callable`
    "SLF001",   # Private member accessed: `_session`
    "TC001",    # Move application import `.helpers.InfrahubDockerCompose` into a type-checking block
    "TC002",    # Move third-party import `pytest` into a type-checking block
    "TC003",    # Move standard library import `types.TracebackType` into a type-checking block
    "TD002",    # Missing author in TODO; try: `# TODO(<author_name>): ...` or `# TODO @<author_name>: ...`
    "TD003",    # Missing issue link for this TODO
    "TD004",    # Missing colon in TODO
    "TRY002",   # Create your own exception
    "TRY003",   # Avoid specifying long messages outside the exception class
]

[tool.hatch.build.targets.sdist]
include = [
    "infrahub_testcontainers",
    "infrahub_testcontainers/docker-compose.test.yml",
    "infrahub_testcontainers/haproxy.cfg",
    "infrahub_testcontainers/prometheus.yml",
]

[tool.hatch.build.targets.wheel]
include = [
    "infrahub_testcontainers",
    "infrahub_testcontainers/docker-compose.test.yml",
    "infrahub_testcontainers/haproxy.cfg",
    "infrahub_testcontainers/prometheus.yml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
