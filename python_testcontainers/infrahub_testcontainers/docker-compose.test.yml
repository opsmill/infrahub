---
# yamllint disable rule:line-length
# The following environment variables are part of the Infrahub configuration options.
# For detailed information on these configuration options, please refer to the Infrahub documentation:
# https://docs.infrahub.app/reference/configuration
# Identifies which CI run and job owns a container, for leftover-container triage on the runners.
# JOB_NAME is the workflow-provided override, GITHUB_JOB the value GitHub sets in every job.
x-ci-labels: &ci-labels
  com.github.run_id: "${GITHUB_RUN_ID:-unknown}"
  com.github.job: "${JOB_NAME:-${GITHUB_JOB:-unknown}}"

services:
  message-queue:
    image: ${MESSAGE_QUEUE_DOCKER_IMAGE:-rabbitmq:4.2.1-management}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: infrahub
      RABBITMQ_DEFAULT_PASS: infrahub
    healthcheck:
      # raw TCP probe instead of rabbitmq-diagnostics: each diagnostics call
      # boots a full Erlang VM (~2s CPU), which at a 1s interval pegs two
      # cores per broker for the life of the stack
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/5672"]
      interval: 1s
      timeout: 1s
      retries: 50
    ports:
      - ${INFRAHUB_TESTING_MESSAGE_QUEUE_PORT:-0}:15692
    labels:
      <<: *ci-labels

  cache:
    image: ${CACHE_DOCKER_IMAGE:-redis:8.4.0}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 1s
      timeout: 1s
      retries: 15
    labels:
      <<: *ci-labels

  infrahub-server-lb:
    image: haproxy:3.1-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      infrahub-server:
        condition: service_started
    healthcheck:
      test: wget -O /dev/null http://127.0.0.1:8000/api/config || exit 1
      interval: 1s
      timeout: 1s
      retries: 100
    ports:
      - ${INFRAHUB_TESTING_SERVER_PORT:-0}:8000
    labels:
      <<: *ci-labels

  database:
    deploy:
      resources:
        limits:
          cpus: ${INFRAHUB_TESTING_DB_CPU_LIMIT:-0.0}
          memory: ${INFRAHUB_TESTING_DB_MEMORY_LIMIT:-0}
    image: ${NEO4J_DOCKER_IMAGE:-neo4j:2026.05.0-community}
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/admin
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_auth__minimum__password__length: 4
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: ${INFRAHUB_TESTING_DB_HEAP_INITIAL_SIZE}
      NEO4J_server_memory_heap_max__size: ${INFRAHUB_TESTING_DB_HEAP_MAX_SIZE}
      NEO4J_server_memory_pagecache_size: ${INFRAHUB_TESTING_DB_PAGECACHE_SIZE}
      # Bolt connector worker threads. Neo4j defaults to 400; a wide computed-attribute
      # fan-out on large datasets can exhaust it (Neo.TransientError.Request.NoThreadsAvailable),
      # so make it tunable for the heavy perf/dataset runs.
      NEO4J_server_bolt_thread__pool__max__size: ${INFRAHUB_TESTING_DB_BOLT_THREAD_POOL_MAX_SIZE}
    ulimits:
      # Default container soft limit (1024) is far too low for a wide recompute fan-out and
      # produces "[Errno 24] Too many open files"; raise the file-descriptor ceiling.
      nofile:
        soft: 1048576
        hard: 1048576
    volumes:
      - "database_data:/data"
      - "database_logs:/logs"
      - "./${INFRAHUB_TESTING_LOCAL_DB_BACKUP_DIRECTORY}:${INFRAHUB_TESTING_INTERNAL_DB_BACKUP_DIRECTORY}"
    healthcheck:
      test: wget -O /dev/null http://localhost:7474 || exit 1
      interval: 1s
      timeout: 1s
      retries: 40
    ports:
      - ${INFRAHUB_TESTING_DATABASE_PORT:-0}:6362
      - ${INFRAHUB_TESTING_DATABASE_BOLT_PORT:-0}:7687
      - ${INFRAHUB_TESTING_DATABASE_UI_PORT:-0}:7474
    labels:
      <<: *ci-labels

  task-manager:
    image: "${INFRAHUB_TESTING_DOCKER_IMAGE}:${INFRAHUB_TESTING_IMAGE_VERSION}"
    command: "${PREFECT_SERVER_COMMAND:-gunicorn -k uvicorn.workers.UvicornWorker -b 0.0.0.0:4200 'infrahub.prefect_server.app:create_infrahub_prefect()'}"
    depends_on:
      task-manager-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      PREFECT_UI_ENABLED: "${INFRAHUB_TESTING_PREFECT_UI_ENABLED}" # enabling UI requires permissions, run container as root to enable UI
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@task-manager-db:5432/prefect

      INFRAHUB_CACHE_ADDRESS: ${INFRAHUB_TESTING_CACHE_ADDRESS}
      PREFECT_REDIS_MESSAGING_HOST: "${INFRAHUB_TESTING_CACHE_ADDRESS:-cache}"
      PREFECT_REDIS_MESSAGING_DB: "1"
      PREFECT_REDIS_MESSAGING_CONSUMER_MIN_IDLE_TIME: ${INFRAHUB_TESTING_TASKMGR_CONSUMER_MIN_IDLE_TIME:-5}
      PREFECT_REDIS_MESSAGING_PUBLISHER_BATCH_SIZE: ${INFRAHUB_TESTING_TASKMGR_PUBLISHER_BATCH_SIZE:-5}

      PREFECT_MESSAGING_BROKER:
      PREFECT_MESSAGING_CACHE:
      PREFECT_SERVER_EVENTS_CAUSAL_ORDERING:
      PREFECT_SERVER_CONCURRENCY_LEASE_STORAGE:
      PREFECT__SERVER_WEBSERVER_ONLY:
      PREFECT_API_DATABASE_MIGRATE_ON_START:
      PREFECT_API_BLOCKS_REGISTER_ON_START:
      PREFECT_SERVER_DOCKET_URL:

      WEB_CONCURRENCY: ${INFRAHUB_TESTING_TASKMGR_API_WORKERS:-1}
    healthcheck:
      test: curl -s -f -o /dev/null http://localhost:4200/api/health || exit 1
      interval: 1s
      timeout: 1s
      retries: 100
    ports:
      - ${INFRAHUB_TESTING_TASK_MANAGER_PORT:-0}:4200
    labels:
      <<: *ci-labels

  task-manager-background-svc:
    deploy:
      mode: replicated
      replicas: ${INFRAHUB_TESTING_TASKMGR_BACKGROUND_SVC_REPLICAS:-0}
    image: "${INFRAHUB_TESTING_DOCKER_IMAGE}:${INFRAHUB_TESTING_IMAGE_VERSION}"
    command: prefect server services start
    restart: unless-stopped
    depends_on:
      task-manager:
        condition: service_healthy
      task-manager-db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      PREFECT_UI_ENABLED: "${INFRAHUB_TESTING_PREFECT_UI_ENABLED}" # This might be required because triggers actions service depends on an in-memory API server
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://postgres:postgres@task-manager-db:5432/prefect

      PREFECT_API_DATABASE_MIGRATE_ON_START: "false"
      PREFECT_API_BLOCKS_REGISTER_ON_START: "false"
      INFRAHUB_CACHE_ADDRESS: ${INFRAHUB_TESTING_CACHE_ADDRESS}
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_SERVER_EVENTS_CAUSAL_ORDERING: prefect_redis.ordering
      PREFECT_SERVER_CONCURRENCY_LEASE_STORAGE: prefect_redis.lease_storage
      PREFECT_REDIS_MESSAGING_HOST: "${INFRAHUB_TESTING_CACHE_ADDRESS:-cache}"
      PREFECT_REDIS_MESSAGING_DB: "1"
      PREFECT_REDIS_MESSAGING_CONSUMER_MIN_IDLE_TIME: ${INFRAHUB_TESTING_TASKMGR_CONSUMER_MIN_IDLE_TIME:-5}
      PREFECT_REDIS_MESSAGING_PUBLISHER_BATCH_SIZE: ${INFRAHUB_TESTING_TASKMGR_PUBLISHER_BATCH_SIZE:-5}

      PREFECT_SERVER_DOCKET_URL: "redis://${INFRAHUB_TESTING_CACHE_ADDRESS:-cache}:6379/2"

      PREFECT_SERVER_SERVICES_EVENT_PERSISTER_READ_BATCH_SIZE: ${INFRAHUB_TESTING_TASKMGR_EVENT_PERSISTER_READ_BATCH_SIZE:-1}
      PREFECT_SERVER_SERVICES_EVENT_PERSISTER_BATCH_SIZE: ${INFRAHUB_TESTING_TASKMGR_EVENT_PERSISTER_BATCH_SIZE:-20}
      PREFECT_SERVER_SERVICES_EVENT_PERSISTER_BATCH_SIZE_DELETE: ${INFRAHUB_TESTING_TASKMGR_EVENT_PERSISTER_BATCH_SIZE_DELETE:-10000}
      PREFECT_SERVER_SERVICES_EVENT_PERSISTER_FLUSH_INTERVAL: ${INFRAHUB_TESTING_TASKMGR_EVENT_PERSISTER_FLUSH_INTERVAL:-5}

      PREFECT_SERVER_SERVICES_TASK_RUN_RECORDER_READ_BATCH_SIZE: ${INFRAHUB_TESTING_TASKMGR_TASK_RUN_RECORDER_READ_BATCH_SIZE:-1}
      PREFECT_SERVER_SERVICES_TASK_RUN_RECORDER_BATCH_SIZE: ${INFRAHUB_TESTING_TASKMGR_TASK_RUN_RECORDER_BATCH_SIZE:-1}
      PREFECT_SERVER_SERVICES_TASK_RUN_RECORDER_FLUSH_INTERVAL: ${INFRAHUB_TESTING_TASKMGR_TASK_RUN_RECORDER_FLUSH_INTERVAL:-5}

      PREFECT_SERVER_SERVICES_TRIGGERS_READ_BATCH_SIZE: ${INFRAHUB_TESTING_TASKMGR_TRIGGERS_READ_BATCH_SIZE:-1}
    labels:
      <<: *ci-labels

  task-manager-db:
    image: "${POSTGRES_DOCKER_IMAGE:-postgres:18-alpine}"
    command: postgres -c 'max_connections=${INFRAHUB_TESTING_TASK_MANAGER_DB_MAX_CONNECTIONS:-100}'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=prefect
    volumes:
      - workflow_db:/var/lib/postgresql/18/docker
      - "./${INFRAHUB_TESTING_LOCAL_DB_BACKUP_DIRECTORY}:${INFRAHUB_TESTING_INTERNAL_DB_BACKUP_DIRECTORY}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 1s
      retries: 50
    labels:
      <<: *ci-labels

  infrahub-server:
    deploy:
      mode: replicated
      replicas: ${INFRAHUB_TESTING_API_SERVER_COUNT}
    image: "${INFRAHUB_TESTING_DOCKER_IMAGE}:${INFRAHUB_TESTING_IMAGE_VERSION}"
    command: ${INFRAHUB_TESTING_DOCKER_ENTRYPOINT}
    ulimits:
      # Raise the file-descriptor ceiling so a wide recompute fan-out doesn't hit
      # "[Errno 24] Too many open files" on the API server's outbound connections.
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      INFRAHUB_PRODUCTION: ${INFRAHUB_TESTING_PRODUCTION}
      INFRAHUB_LOG_LEVEL: ${INFRAHUB_TESTING_LOG_LEVEL:-INFO}
      INFRAHUB_BROKER_ADDRESS: ${INFRAHUB_TESTING_BROKER_ADDRESS}
      INFRAHUB_CACHE_ADDRESS: ${INFRAHUB_TESTING_CACHE_ADDRESS}
      INFRAHUB_DB_ADDRESS: ${INFRAHUB_TESTING_DB_ADDRESS}
      INFRAHUB_WORKFLOW_ADDRESS: ${INFRAHUB_TESTING_WORKFLOW_ADDRESS}
      INFRAHUB_WORKFLOW_DEFAULT_WORKER_TYPE: ${INFRAHUB_TESTING_WORKFLOW_DEFAULT_WORKER_TYPE}
      INFRAHUB_INITIAL_ADMIN_TOKEN: ${INFRAHUB_TESTING_INITIAL_ADMIN_TOKEN}
      INFRAHUB_INITIAL_AGENT_TOKEN: ${INFRAHUB_TESTING_INITIAL_AGENT_TOKEN}
      INFRAHUB_SECURITY_SECRET_KEY: ${INFRAHUB_TESTING_SECURITY_SECRET_KEY}
      PREFECT_API_URL: ${INFRAHUB_TESTING_PREFECT_API}
      INFRAHUB_EXPERIMENTAL_VALUE_DB_INDEX:
      # Tracing
      INFRAHUB_TRACE_ENABLE: ${INFRAHUB_TRACE_ENABLE:-false}
      INFRAHUB_TRACE_EXPORTER_ENDPOINT:
      INFRAHUB_TRACE_EXPORTER_PROTOCOL: ${INFRAHUB_TRACE_EXPORTER_PROTOCOL:-grpc}
      INFRAHUB_TRACE_EXPORTER_TYPE: ${INFRAHUB_TRACE_EXPORTER_TYPE:-console}
      INFRAHUB_TRACE_INSECURE: ${INFRAHUB_TRACE_INSECURE:-true}
      INFRAHUB_SCHEMA_STRICT_MODE: ${INFRAHUB_TESTING_SCHEMA_STRICT_MODE}
      INFRAHUB_COALESCE_PYTHON_RECOMPUTE_AFTER_MERGE: ${INFRAHUB_COALESCE_PYTHON_RECOMPUTE_AFTER_MERGE:-true}
      INFRAHUB_MERGE_FAILURE_GRACE_PERIOD_SECONDS: ${INFRAHUB_TESTING_MERGE_FAILURE_GRACE_PERIOD_SECONDS:-1}
      OTEL_RESOURCE_ATTRIBUTES:
    depends_on:
      database:
        condition: service_healthy
      message-queue:
        condition: service_healthy
      cache:
        condition: service_healthy
      task-manager:
        condition: service_healthy
    volumes:
      - "storage_data:/opt/infrahub/storage"
    tty: true
    healthcheck:
      test: curl -s -f -o /dev/null http://localhost:8000/api/config || exit 1
      interval: 1s
      timeout: 1s
      retries: 100
    labels:
      <<: *ci-labels

  task-worker:
    deploy:
      mode: replicated
      replicas: ${INFRAHUB_TESTING_TASK_WORKER_COUNT}
    image: "${INFRAHUB_TESTING_DOCKER_IMAGE}:${INFRAHUB_TESTING_IMAGE_VERSION}"
    command: prefect worker start --type ${INFRAHUB_TESTING_WORKFLOW_DEFAULT_WORKER_TYPE} --pool infrahub-worker --with-healthcheck
    ulimits:
      # The recompute fan-out runs here; the worker opens many concurrent DB/HTTP
      # connections and hits "[Errno 24] Too many open files" at the default 1024 ceiling.
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      INFRAHUB_PRODUCTION: ${INFRAHUB_TESTING_PRODUCTION}
      INFRAHUB_LOG_LEVEL: ${INFRAHUB_TESTING_LOG_LEVEL}
      INFRAHUB_GIT_REPOSITORIES_DIRECTORY: ${INFRAHUB_TESTING_GIT_REPOSITORIES_DIRECTORY}
      INFRAHUB_API_TOKEN: ${INFRAHUB_TESTING_INITIAL_AGENT_TOKEN}
      INFRAHUB_SECURITY_SECRET_KEY: ${INFRAHUB_TESTING_SECURITY_SECRET_KEY}
      INFRAHUB_ADDRESS: ${INFRAHUB_TESTING_ADDRESS}
      INFRAHUB_INTERNAL_ADDRESS: ${INFRAHUB_TESTING_INTERNAL_ADDRESS}
      INFRAHUB_BROKER_ADDRESS: ${INFRAHUB_TESTING_BROKER_ADDRESS}
      INFRAHUB_CACHE_ADDRESS: ${INFRAHUB_TESTING_CACHE_ADDRESS}
      INFRAHUB_DB_ADDRESS: ${INFRAHUB_TESTING_DB_ADDRESS:-database}
      INFRAHUB_WORKFLOW_ADDRESS: ${INFRAHUB_TESTING_WORKFLOW_ADDRESS}
      INFRAHUB_TIMEOUT: ${INFRAHUB_TESTING_TIMEOUT}
      INFRAHUB_PAGINATION_SIZE: ${INFRAHUB_TESTING_PAGINATION_SIZE:-50}
      PREFECT_API_URL: ${INFRAHUB_TESTING_PREFECT_API}
      PREFECT_API_REQUEST_TIMEOUT: ${INFRAHUB_TESTING_PREFECT_API_REQUEST_TIMEOUT:-120}
      INFRAHUB_EXPERIMENTAL_VALUE_DB_INDEX:
      # Tracing
      INFRAHUB_TRACE_ENABLE: ${INFRAHUB_TRACE_ENABLE:-false}
      INFRAHUB_TRACE_EXPORTER_ENDPOINT:
      INFRAHUB_TRACE_EXPORTER_PROTOCOL: ${INFRAHUB_TRACE_EXPORTER_PROTOCOL:-grpc}
      INFRAHUB_TRACE_EXPORTER_TYPE: ${INFRAHUB_TRACE_EXPORTER_TYPE:-console}
      INFRAHUB_TRACE_INSECURE: ${INFRAHUB_TRACE_INSECURE:-true}
      INFRAHUB_SCHEMA_STRICT_MODE: ${INFRAHUB_TESTING_SCHEMA_STRICT_MODE}
      INFRAHUB_COALESCE_PYTHON_RECOMPUTE_AFTER_MERGE: ${INFRAHUB_COALESCE_PYTHON_RECOMPUTE_AFTER_MERGE:-true}
      INFRAHUB_MERGE_FAILURE_GRACE_PERIOD_SECONDS: ${INFRAHUB_TESTING_MERGE_FAILURE_GRACE_PERIOD_SECONDS:-1}
      OTEL_RESOURCE_ATTRIBUTES:
    depends_on:
      - infrahub-server
    volumes:
      - "./${INFRAHUB_TESTING_LOCAL_REMOTE_GIT_DIRECTORY}:${INFRAHUB_TESTING_INTERNAL_REMOTE_GIT_DIRECTORY}"
    tty: true
    labels:
      <<: *ci-labels

  cadvisor:
    image: "${CADVISOR_DOCKER_IMAGE:-ghcr.io/google/cadvisor:v0.60.5}"
    command:
      - -disable_root_cgroup_stats=true
      - -docker_only=true
      - -store_container_labels=false
      - -whitelisted_container_labels=com.docker.compose.project
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "${INFRAHUB_TESTING_CADVISOR_PORT:-0}:8080"
    labels:
      <<: *ci-labels

  scraper:
    image: "${SCRAPER_DOCKER_IMAGE:-victoriametrics/victoria-metrics:v1.110.0}"
    volumes:
      - vmdata:/victoria-metrics-data
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
    ports:
      - ${INFRAHUB_TESTING_SCRAPER_PORT:-0}:8428
    healthcheck:
      test: wget -qO- http://127.0.0.1:8428/-/healthy
      interval: 1s
      timeout: 1s
      retries: 50
    labels:
      <<: *ci-labels

volumes:
  database_data:
  database_logs:
  storage_data:
  workflow_db:
  vmdata:
