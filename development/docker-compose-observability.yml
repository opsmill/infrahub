---
services:
  # --------------------------------------------------------------------------------
  #  - Alloy to collect logs and scrape metrics (replaces Promtail + Prometheus scraper)
  #  - Prometheus to store metrics (TSDB + remote write receiver)
  #  - Tempo to receive traces
  #  - Grafana to visualize metrics, logs, and traces
  #  - Loki to receive and store logs
  #
  # Services are prefixed with "infrahub-" to avoid DNS collisions with any
  # pre-existing "prometheus", "grafana", etc. services a user may already run.
  # --------------------------------------------------------------------------------
  infrahub-alloy:
    profiles: [debug]
    image: grafana/alloy:v1.15.0
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "12345:12345"
    depends_on:
      - infrahub-loki
      - infrahub-prometheus

  infrahub-loki:
    profiles: [debug]
    image: grafana/loki:3.7.1
    command:
      - '-config.file=/etc/loki/config.yml'
      - '-config.expand-env=true'
    volumes:
      - type: bind
        source: ./loki/config.yml
        target: /etc/loki/config.yml
        read_only: true
      - loki_data:/loki
    ports:
      - "3100:3100"

  infrahub-tempo-init:
    profiles: [trace]
    image: busybox:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - tempo_data:/var/tempo

  infrahub-tempo:
    profiles: [trace]
    image: grafana/tempo:2.10.3
    volumes:
      - type: bind
        source: ./tempo/config.yml
        target: /etc/tempo.yaml
        read_only: true
      - tempo_data:/tmp/tempo
    command:
      - '-config.file=/etc/tempo.yaml'
    ports:
      - "3200:3200"
    depends_on:
      - infrahub-tempo-init

  infrahub-task-manager-exporter:
    profiles: [debug]
    image: prefecthq/prometheus-prefect-exporter:3.3.0
    environment:
      PREFECT_API_URL: http://task-manager:4200/api
      LOG_LEVEL: WARNING
    ports:
      - "4201:8000"
    depends_on:
      task-manager:
        condition: service_healthy
    labels:
      namespace: "prefect"
      pod: "prefect-exporter"

  infrahub-prometheus:
    profiles: [debug]
    image: prom/prometheus:v3.11.0
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/dev/null'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=4d'
      - '--storage.tsdb.retention.size=20GB'
      - '--storage.tsdb.wal-compression'
      - '--storage.tsdb.min-block-duration=1h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--log.level=warn'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "9090:9090"

  infrahub-node-exporter:
    profiles: [debug]
    image: prom/node-exporter:v1.10.2
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "9100:9100"

  infrahub-cadvisor:
    profiles: [debug]
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "8080:8080"

  infrahub-grafana:
    profiles: [debug]
    image: grafana/grafana:11.4.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
      - grafana_logs:/var/log/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=warn
      - GF_LOG_MODE=console,file
      - GF_LOG_DIR=/var/log/grafana
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "3500:3000"
    depends_on:
      - infrahub-prometheus
      - infrahub-loki

volumes:
  grafana_data:
  grafana_logs:
  prometheus_data:
  loki_data:
  tempo_data:
