---
services:
  # --------------------------------------------------------------------------------
  #  - Alloy to collect logs and scrape metrics (replaces Promtail + Prometheus scraper)
  #  - Prometheus to store metrics (TSDB + remote write receiver)
  #  - Tempo to receive traces
  #  - Grafana to visualize metrics, logs, and traces
  #  - Loki to receive and store logs
  #
  # Services are prefixed with "infrahub-" to avoid DNS collisions with any
  # pre-existing "prometheus", "grafana", etc. services a user may already run.
  # --------------------------------------------------------------------------------
  infrahub-alloy:
    profiles: [debug]
    image: grafana/alloy:v1.15.0
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      # Neo4j Community has no metrics endpoint: set INFRAHUB_NEO4J_METRICS_TARGET to an empty value to stop the scrape.
      NEO4J_METRICS_TARGET: "${INFRAHUB_NEO4J_METRICS_TARGET-database:2004}"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "12345:12345"
    depends_on:
      - infrahub-loki
      - infrahub-prometheus

  infrahub-loki:
    profiles: [debug]
    image: grafana/loki:3.7.1
    command:
      - '-config.file=/etc/loki/config.yml'
      - '-config.expand-env=true'
    volumes:
      - type: bind
        source: ./loki/config.yml
        target: /etc/loki/config.yml
        read_only: true
      - loki_data:/loki
    ports:
      - "3100:3100"

  infrahub-tempo-init:
    profiles: [trace]
    image: busybox:latest
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - tempo_data:/var/tempo

  infrahub-tempo:
    profiles: [trace]
    image: grafana/tempo:2.10.3
    volumes:
      - type: bind
        source: ./tempo/config.yml
        target: /etc/tempo.yaml
        read_only: true
      - tempo_data:/tmp/tempo
    command:
      - '-config.file=/etc/tempo.yaml'
    ports:
      - "3200:3200"
    depends_on:
      infrahub-tempo-init:
        condition: service_completed_successfully

  infrahub-task-manager-exporter:
    profiles: [debug]
    image: prefecthq/prometheus-prefect-exporter:3.3.0
    environment:
      PREFECT_API_URL: http://task-manager:4200/api
      LOG_LEVEL: WARNING
    ports:
      - "4201:8000"
    depends_on:
      task-manager:
        condition: service_healthy
    labels:
      namespace: "prefect"
      pod: "prefect-exporter"

  infrahub-prometheus:
    profiles: [debug]
    image: prom/prometheus:v3.11.0
    volumes:
      - prometheus_data:/prometheus
    command:
      - '--config.file=/dev/null'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=4d'
      - '--storage.tsdb.retention.size=20GB'
      - '--storage.tsdb.wal-compression'
      - '--storage.tsdb.min-block-duration=1h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'
      - '--log.level=warn'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "9090:9090"

  infrahub-node-exporter:
    profiles: [debug]
    image: prom/node-exporter:v1.10.2
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "9100:9100"

  infrahub-cadvisor:
    profiles: [debug]
    image: ghcr.io/google/cadvisor:v0.60.5
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "8080:8080"

  infrahub-grafana:
    profiles: [debug]
    image: grafana/grafana:11.4.0
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
      - grafana_logs:/var/log/grafana
    environment:
      # The Grafana MCP init step logs in with the same two settings.
      - GF_SECURITY_ADMIN_USER=${INFRAHUB_GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${INFRAHUB_GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=warn
      - GF_LOG_MODE=console,file
      - GF_LOG_DIR=/var/log/grafana
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "3500:3000"
    depends_on:
      - infrahub-prometheus
      - infrahub-loki

  infrahub-grafana-mcp-init:
    # Grafana MCP server: gives an AI assistant read access to Grafana. Off by default.
    # Turn it on with COMPOSE_PROFILES=grafana-mcp (or --profile grafana-mcp) and set
    # INFRAHUB_GRAFANA_MCP_TOKEN, the token that AI assistants send.
    # This service runs once: it creates the Grafana service account of the server and stores its token.
    profiles: [grafana-mcp]
    image: grafana/grafana:11.4.0
    # A new volume belongs to root, so root writes the token file and gives it to the user of the server.
    user: root
    entrypoint: ["/bin/sh", "/usr/local/bin/create-service-account.sh"]
    volumes:
      - ./grafana-mcp/create-service-account.sh:/usr/local/bin/create-service-account.sh:ro
      - grafana_mcp_token:/var/run/grafana-mcp
    environment:
      GRAFANA_URL: http://infrahub-grafana:3000
      GRAFANA_ADMIN_USER: ${INFRAHUB_GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${INFRAHUB_GRAFANA_ADMIN_PASSWORD:-admin}
      GRAFANA_MCP_TOKEN_FILE: /var/run/grafana-mcp/token
      GRAFANA_MCP_TOKEN_FILE_OWNER: "1000:999"
    depends_on:
      # Not required, so that the file loads when the profile of the Grafana service is off.
      infrahub-grafana:
        condition: service_started
        required: false

  infrahub-grafana-mcp:
    # No restart policy: the server must stay stopped when its entrypoint refuses to start it.
    profiles: [grafana-mcp]
    image: grafana/mcp-grafana:2.0.2@sha256:78d208116ec52b09b44f0eca66892073b39aefcb64483c54d43255c8eab7e97a
    # The user of the image, written here because the init step gives the token file to it.
    user: "1000:999"
    entrypoint: ["/bin/sh", "/usr/local/bin/grafana-mcp-entrypoint.sh"]
    volumes:
      - ./grafana-mcp/entrypoint.sh:/usr/local/bin/grafana-mcp-entrypoint.sh:ro
      - grafana_mcp_token:/var/run/grafana-mcp:ro
      # A bind mount needs a source even when no TLS file is set, so the default is an empty file.
      # The entrypoint turns TLS on from the two settings below, not from these files.
      - type: bind
        source: ${INFRAHUB_GRAFANA_MCP_TLS_CERT_FILE:-/dev/null}
        target: /etc/grafana-mcp/tls/tls.crt
        read_only: true
      - type: bind
        source: ${INFRAHUB_GRAFANA_MCP_TLS_KEY_FILE:-/dev/null}
        target: /etc/grafana-mcp/tls/tls.key
        read_only: true
    environment:
      INFRAHUB_GRAFANA_MCP_TOKEN: ${INFRAHUB_GRAFANA_MCP_TOKEN:-}
      INFRAHUB_GRAFANA_MCP_ALLOWED_HOSTS: ${INFRAHUB_GRAFANA_MCP_ALLOWED_HOSTS:-localhost:8100,127.0.0.1:8100}
      # The same value as the port below: the entrypoint refuses an address open to a network without TLS.
      INFRAHUB_GRAFANA_MCP_LISTEN_ADDRESS: ${INFRAHUB_GRAFANA_MCP_LISTEN_ADDRESS:-127.0.0.1}
      INFRAHUB_GRAFANA_MCP_TLS_CERT_FILE: ${INFRAHUB_GRAFANA_MCP_TLS_CERT_FILE:-}
      INFRAHUB_GRAFANA_MCP_TLS_KEY_FILE: ${INFRAHUB_GRAFANA_MCP_TLS_KEY_FILE:-}
      GRAFANA_URL: http://infrahub-grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /var/run/grafana-mcp/token
      DO_NOT_TRACK: "1"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    ports:
      - "${INFRAHUB_GRAFANA_MCP_LISTEN_ADDRESS:-127.0.0.1}:8100:8000"
    depends_on:
      infrahub-grafana-mcp-init:
        condition: service_completed_successfully

volumes:
  grafana_mcp_token:
  grafana_data:
  grafana_logs:
  prometheus_data:
  loki_data:
  tempo_data:
