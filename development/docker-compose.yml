x-infrahub-sso: &infrahub_sso
  INFRAHUB_SECURITY_SSO_USER_DEFAULT_GROUP:
  INFRAHUB_SECURITY_OAUTH2_PROVIDERS:
  INFRAHUB_SECURITY_OAUTH2_PROVIDER_SETTINGS:
  INFRAHUB_SECURITY_OIDC_PROVIDERS:
  INFRAHUB_SECURITY_OIDC_PROVIDER_SETTINGS:
  # Provider related settings
  ## OAUTH2 Provider 1
  INFRAHUB_OAUTH2_PROVIDER1_CLIENT_ID:
  INFRAHUB_OAUTH2_PROVIDER1_CLIENT_SECRET:
  INFRAHUB_OAUTH2_PROVIDER1_AUTHORIZATION_URL:
  INFRAHUB_OAUTH2_PROVIDER1_TOKEN_URL:
  INFRAHUB_OAUTH2_PROVIDER1_USERINFO_URL:
  INFRAHUB_OAUTH2_PROVIDER1_DISPLAY_LABEL:
  INFRAHUB_OAUTH2_PROVIDER1_ICON:
  ## OIDC Provider 1
  INFRAHUB_OIDC_PROVIDER1_CLIENT_ID:
  INFRAHUB_OIDC_PROVIDER1_CLIENT_SECRET:
  INFRAHUB_OIDC_PROVIDER1_DISCOVERY_URL:
  INFRAHUB_OIDC_PROVIDER1_DISPLAY_LABEL:
  INFRAHUB_OIDC_PROVIDER1_ICON:

services:
  server:
    profiles: [demo, dev]
    build:
      context: ../
      args:
        CI_ARG: ${CI:-0}
        UV_VER: ${UV_VERSION:-0.9.9}
      dockerfile: development/Dockerfile
      target: backend
    image: "${IMAGE_NAME}:${IMAGE_VER}"
    pull_policy: always
    environment:
      <<: [*infrahub_config, *infrahub_sso]
      INFRAHUB_INTERNAL_ADDRESS: "http://server:8000"
      INFRAHUB_GIT_REPOSITORIES_DIRECTORY: "/opt/infrahub/git"
      INFRAHUB_PRODUCTION: "${INFRAHUB_PRODUCTION:-false}"
      INFRAHUB_INITIAL_ADMIN_TOKEN: 06438eb2-8019-4776-878c-0941b1f1d1ec
      INFRAHUB_SECURITY_SECRET_KEY: 327f747f-efac-42be-9e73-999f08f86b92
      INFRAHUB_BROKER_ADDRESS: message-queue
      INFRAHUB_CACHE_ADDRESS: "${INFRAHUB_CACHE_ADDRESS:-cache}"
      INFRAHUB_WORKFLOW_ADDRESS: "${INFRAHUB_WORKFLOW_ADDRESS:-task-manager}"
      INFRAHUB_WORKFLOW_PORT: "${INFRAHUB_WORKFLOW_PORT:-4200}"
      PREFECT_API_URL: http://${INFRAHUB_WORKFLOW_ADDRESS:-task-manager}:${INFRAHUB_WORKFLOW_PORT:-4200}/api
      INFRAHUB_DB_ADDRESS: database
      INFRAHUB_DB_USERNAME: neo4j
      INFRAHUB_DB_PASSWORD: admin
      INFRAHUB_DB_PORT: 7687
      INFRAHUB_DB_PROTOCOL: bolt
      INFRAHUB_STORAGE_DRIVER: local
      # INFRAHUB_SERVER_COMMAND is defined while running with reload option as it requires to run server using `uvicorn`.
      COMMAND: ${INFRAHUB_SERVER_COMMAND:- gunicorn --config backend/infrahub/serve/gunicorn_config.py -w ${WEB_CONCURRENCY:-4} --logger-class infrahub.serve.log.GunicornLogger infrahub.server:app}
    command: >
      sh -c "$$COMMAND"
    depends_on:
      database:
        condition: service_healthy
      message-queue:
        condition: service_healthy
      cache:
        condition: service_healthy
      task-manager:
        condition: service_healthy
    volumes:
      - "storage_data:/opt/infrahub/storage"
    tty: true
    labels:
      com.github.run_id: "${GITHUB_RUN_ID:-unknown}"
      com.github.job: "${JOB_NAME:-unknown}"
    healthcheck:
      test: curl -s -f -o /dev/null http://localhost:8000/api/config || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
  task-worker:
    profiles: [demo, dev]
    deploy:
      mode: replicated
      replicas: 2
    build:
      context: ../
      args:
        CI_ARG: ${CI:-0}
        UV_VER: ${UV_VERSION:-0.9.9}
      dockerfile: development/Dockerfile
      target: backend
    image: "${IMAGE_NAME}:${IMAGE_VER}"
    pull_policy: always
    command: prefect worker start --type infrahubasync --pool infrahub-worker --with-healthcheck
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      <<: *infrahub_config
      INFRAHUB_ADDRESS: http://server:8000
      INFRAHUB_INTERNAL_ADDRESS: "http://server:8000"
      INFRAHUB_GIT_REPOSITORIES_DIRECTORY: "/opt/infrahub/git"
      INFRAHUB_DB_ADDRESS: "database"
      INFRAHUB_PRODUCTION: false
      INFRAHUB_API_TOKEN: "${INFRAHUB_API_TOKEN:-06438eb2-8019-4776-878c-0941b1f1d1ec}"
      INFRAHUB_TIMEOUT: "${INFRAHUB_TIMEOUT:-60}"
      INFRAHUB_BROKER_ADDRESS: message-queue
      INFRAHUB_CACHE_ADDRESS: "${INFRAHUB_CACHE_ADDRESS:-cache}"
      INFRAHUB_WORKFLOW_ADDRESS: "${INFRAHUB_WORKFLOW_ADDRESS:-task-manager}"
      INFRAHUB_WORKFLOW_PORT: "${INFRAHUB_WORKFLOW_PORT:-4200}"
      PREFECT_API_URL: http://${INFRAHUB_WORKFLOW_ADDRESS:-task-manager}:${INFRAHUB_WORKFLOW_PORT:-4200}/api
      INFRAHUB_DB_USERNAME: neo4j
      INFRAHUB_DB_PASSWORD: admin
      INFRAHUB_DB_PORT: 7687
      INFRAHUB_DB_PROTOCOL: bolt
      INFRAHUB_STORAGE_DRIVER: local
    volumes:
      - "git_remote_data:/remote"
    tty: true
    labels:
      com.github.run_id: "${GITHUB_RUN_ID:-unknown}"
      com.github.job: "${JOB_NAME:-unknown}"
      namespace: "prefect"
      pod: "prefect-agent"

volumes:
  git_remote_data:
  storage_data:
