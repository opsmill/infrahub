---
services:
  database:
    profiles: [demo, dev, debug]
    image: "${DATABASE_DOCKER_IMAGE:-neo4j:2026.05.0-community}"
    environment:
      - "NEO4J_AUTH=neo4j/admin"
      - "NEO4J_dbms_security_procedures_unrestricted=apoc.*"
      - "NEO4J_dbms_security_auth__minimum__password__length=4"
    volumes:
      - "./plugins:/plugins"
      - "database_data:/data"
      - "database_logs:/logs"
    healthcheck:
      test: wget -O /dev/null http://localhost:7474 || exit 1
      interval: 2s
      timeout: 10s
      retries: 40
      start_period: 3s
    labels:
      infrahub_role: "database"
      com.github.run_id: "${GITHUB_RUN_ID:-unknown}"
      com.github.job: "${JOB_NAME:-unknown}"

volumes:
  database_data:
  database_logs:
