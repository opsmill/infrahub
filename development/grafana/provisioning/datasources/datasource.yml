---
apiVersion: 1

datasources:
  - name: Prometheus (Local)
    type: prometheus
    uid: localprometheus
    access: proxy
    orgId: 1
    url: http://infrahub-prometheus:9090
    basicAuth: false
    editable: true

  - name: Loki (Local)
    type: loki
    uid: localloki
    url: http://infrahub-loki:3100
    editable: true
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: '(?:trace_id=|TraceID=|"trace_id":\s*")(?:0x)?([0-9a-f]+)'
          url: '$${__value.raw}'
          urlDisplayLabel: "View trace in Tempo"
          datasourceUid: 'localtempo'

  - name: Tempo (Local)
    type: tempo
    uid: localtempo
    url: http://infrahub-tempo:3200
    access: proxy
    basicAuth: false
    jsonData:
      serviceMap:
        datasourceUid: 'localprometheus'
      tracesToLogsV2:
        datasourceUid: 'localloki'
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{job=~".+"} |~ `(?i)trace_?id[=": ]+(0x)?$${__trace.traceId}`'
      tracesToMetrics:
        datasourceUid: 'localprometheus'
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: 'localloki'
      traceQuery:
        timeShiftEnabled: true
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
