StylesPath = .vale/styles

MinAlertLevel = warning

[formats]
mdx = md

; Only lint the published documentation in docs/docs/
[docs/docs/**/*.md]
BasedOnStyles = Infrahub
;(import.*?\n) to ignore import statement in .mdx
;(```.*?```\n) to ignore code block in .mdx
BlockIgnores = (?s) *((import.*?\n)|(```.*?```\n))

[docs/docs/**/*.mdx]
BasedOnStyles = Infrahub
;(import.*?\n) to ignore import statement in .mdx
;(```.*?```\n) to ignore code block in .mdx
BlockIgnores = (?s) *((import.*?\n)|(```.*?```\n))

; Ignore content in reference directories (auto-generated)
[docs/docs/reference/**]
BasedOnStyles =

; Ignore internal documentation (specs, plans, etc.)
[docs/specs/**]
BasedOnStyles =

[docs/plans/**]
BasedOnStyles =

[**/AGENTS.md]
BasedOnStyles =
