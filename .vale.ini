StylesPath = .vale/styles

MinAlertLevel = warning

[formats]
mdx = md

[docs/**/*.md]
BasedOnStyles = Infrahub
;(import.*?\n) to ignore import statement in .md
;(```.*?```\n) to ignore code block in .md
BlockIgnores = (?s) *((import.*?\n)|(```.*?```\n))

[docs/**/*.mdx]
BasedOnStyles = Infrahub
;(import.*?\n) to ignore import statement in .mdx
;(```.*?```\n) to ignore code block in .mdx
BlockIgnores = (?s) *((import.*?\n)|(```.*?```\n))

[changelog/**/*.md]
; Apply Infrahub style checks to towncrier newsfragments to catch errors
BasedOnStyles = Infrahub

; Ignore content in reference directories
[docs/docs/reference/**]
BasedOnStyles =

; Ignore content for that release note document
[docs/docs/release-notes/infrahub/docs-restructure.mdx]
BasedOnStyles =

; Suppress branded-terms-case-swap on a Python import line in a fenced code
; block that the BlockIgnores regex above fails to skip. See the spawned task
; "Fix vale BlockIgnores regex for fenced code blocks" for the underlying fix.
[docs/docs/generators/build.mdx]
Infrahub.branded-terms-case-swap = NO

; Ignore dev-internal docs (team workflow files, not user-facing)
[docs/redirects-pending/**]
BasedOnStyles =

; Ignore dev-internal design specs and plans (not user-facing)
[docs/superpowers/**]
BasedOnStyles =

[**/AGENTS.md]
BasedOnStyles =

; "Repo Auditor" is the proper name of the infrahub-repo-auditor skill, not
; the informal abbreviation the swap rule targets. Suppressed for these files
; instead of an inline vale comment because the flagged text sits inside
; Markdown tables, where an interleaved HTML comment breaks GFM table parsing.
[docs/docs/overview/build-with-ai/index.mdx]
Infrahub.swap = NO

[docs/docs/overview/build-with-ai/working-with-ai.mdx]
Infrahub.swap = NO
