StylesPath = .vale/styles

MinAlertLevel = warning

[formats]
mdx = md

[docs/**/*.md]
BasedOnStyles = Infrahub
;(import.*?\n) to ignore import statement in .mdx
;(```.*?```\n) to ignore code block in .mdx
BlockIgnores = (?s) *((import.*?\n)|(```.*?```\n))

[docs/**/*.mdx]
BasedOnStyles = Infrahub
;(import.*?\n) to ignore import statement in .mdx
;(```.*?```\n) to ignore code block in .mdx
BlockIgnores = (?s) *((import.*?\n)|(```.*?```\n))

; Ignore content in reference directories
[docs/docs/reference/**]
BasedOnStyles =

; Ignore dev-internal docs (team workflow files, not user-facing)
[docs/redirects-pending/**]
BasedOnStyles =

[**/AGENTS.md]
BasedOnStyles =
