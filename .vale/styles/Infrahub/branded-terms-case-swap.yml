---
extends: substitution
message: Use '%s' instead of '%s'
level: error
ignorecase: false
action:
  name: replace
swap:
  (?<![\.|/|#])ansible[\.!]?\s: Ansible
  (?<=[a-z]\s)Artifact[\.!]?\s: artifact
  (?<=[a-z]\s)Artifacts[\.!]?\s: artifacts
  (?<![\.|/|#])docker[\.!]?\s: Docker
  (?<![\.|/|#])[Dd]ockerhub[\.!]?\s: DockerHub
  (?<![\.|/|#])generator[\.!]?\s: Generator
  (?<![\.|/|#])generators[\.!]?\s: Generators
  (?<![\.|/|#])[Gg]ithub[\.!]?\s: GitHub
  (?<![\.|/|#])[Gg]itlab[\.!]?\s: GitLab
  (?:gitpod): GitPod
  (?:grafana): Grafana
  (?:[^/.][Gg]raphql): GraphQL
  (?<![\.|/|#])infrahub[\.!]?\s: Infrahub
  (?:[Ii]nflux[Dd]b): InfluxDB
  (?:jinja2): Jinja2
  (?:k3s): K3s
  (?<![\.|/|#])k8s[\.!]?\s: K8s
  (?:kubernetes): Kubernetes
  (?:[^/][Mm]y[Ss]ql): MySQL
  (?<![\.|/|#])neo4j[\.!]?\s: Neo4j
  (?:[^/][Nn]ginx): NGINX
  (?:[Nn]odejs): Node.js
  (?:[^/][Oo]penapi): OpenAPI
  (?:Openconfig): OpenConfig
  (?<![\.|/|#])opsmill[\.!]?\s: OpsMill
  (?:[Pp]ostgre[Ss]ql): PostgreSQL
  (?<![\.|/|#])profile[\.!]?\s: Profile
  (?<![\.|/|#])profiles[\.!]?\s: Profiles
  (?:[^/]prometheus): Prometheus
  (?<![\.|/|#])python[\.!]?\s: Python
  (?<![\.|/|#])[Rr]abbitmq[\.!]?\s: RabbitMQ
  relatioinship: relationship
  Relatioinship: Relationship
  (?<![\.|/|#])(?:resource [Mm]anager|Resource manager)[\.!]?\s: Resource Manager
  (?<![\.|/|#])[Rr]esource [Mm]anagers[\.!]?\s: Resource Manager
  (?:[^/]terraform): Terraform
  (?<![\.|/|#])transformation[\.!]?\s: Transformation
  (?<![\.|/|#])transformations[\.!]?\s: Transformations
  (?<![\.|/|#])[Tt]ransforms[\.!]?\s: Transformations
  (?:ubuntu): Ubuntu
  (?:[Vv]s\W?[Cc]ode): VS Code
