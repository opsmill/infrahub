---
extends: capitalization
message: "'%s' should use sentence case"
level: warning
scope:
  - heading.h1
  - heading.h2
  - heading.h3
  - heading.h4
  - heading.h5
  - heading.h6
match: $sentence
exceptions:
  # Product and company names
  - Infrahub
  - OpsMill
  - Neo4j
  - GraphQL
  - RabbitMQ
  - Kubernetes
  - Helm
  - Terraform
  - Jinja2
  - Git
  - GitHub
  - GitLab
  - IP Fabric

  # Acronyms and abbreviations
  - API
  - APIs
  - REST
  - SDK
  - SSO
  - IPAM
  - IP
  - CI
  - CD
  - UI
  - OIDC
  - OAuth
  - AWS
  - S3
  - E2E
  - URI
  - HFID
  - NATS
  - JetStream
  - CSS
  - VLAN
  - WebUI
  - IDE

  # Technical terms that should keep their case
  - Python
  - CoreArtifactTarget
  - CoreGroup
  - TransformPython
  - infrahubctl
  - Namespace
  - Generics
  - Docker
  - Profiles
  - Display
  - Label
  - Enterprise
  - Alpha
  - Beta
  - Release
  - OpenID
  - Connect
  - CA
  - Object
  - Schema
  - Attributes
  - Relationships
  - Node
  - Scalability
  - High
  - Availability
  - Friendly
  - Identifier
  - NumberPool
  - Human
  - Tony
  - Stark
  - include_in_menu
  - menu_placement

  # Configuration/environment variables
  - INFRAHUB_SECURITY_OAUTH2_PROVIDER_SETTINGS
  - INFRAHUB_SECURITY_OIDC_PROVIDER_SETTINGS
  - INFRAHUB_STORAGE_LOCAL
  - INFRAHUB_STORAGE_S3

  # Roman numerals
  - I
  - II
  - III
  - IV
  - V
