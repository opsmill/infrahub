[project]
name = "infrahub-server"
version = "1.7.4"
description = "Infrahub is taking a new approach to Infrastructure Management by providing a new generation of datastore to organize and control all the data that defines how an infrastructure should run."
authors = [{ name = "OpsMill", email = "info@opsmill.com" }]
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "Apache-2.0"

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "neo4j==6.0.3",
    "neo4j-rust-ext==6.0.3.0",
    "pydantic>=2.12,<2.13",
    "pydantic-settings>=2.8,<2.9",
    "pytest>=9.0,<9.1",
    "aio-pika>=9.4,<9.5",
    "structlog==24.1.0",
    "boto3==1.34.129",
    "email-validator>=2.1,<2.2",
    "redis[hiredis]==6.0.0",
    "typer==0.19.2",
    "click==8.1.7",
    "prefect==3.6.13",
    "prefect-redis==0.2.8",
    "ujson>=5,<6",
    "Jinja2>=3,<4",
    "gitpython>=3,<4",
    "pyyaml>=6,<7",
    "tomli>=1.1.0; python_version<='3.11'",
    "deepdiff==8.6.1",
    # Dependencies specific to the API Server
    "fastapi==0.121.1",
    "fastapi-storages>=0.3,<0.4",
    "graphene>=3.4,<3.5",
    "gunicorn>=23.0.0,<24",
    "lunr>=0.7.0.post1,<0.8",
    "starlette-exporter>=0.23,<0.24",
    "python-multipart==0.0.22", # Required by FastAPI to upload large files
    "asgi-correlation-id==4.2.0", # Middleware for FastAPI to generate ID per request
    "bcrypt>=4.1,<4.2", # Used to hash and validate password
    "pyjwt>=2.8,<2.9", # Used to manage JWT tokens
    "uvicorn[standard]>=0.32,<0.33",
    "opentelemetry-instrumentation-aio-pika==0.60b0",
    "opentelemetry-instrumentation-fastapi==0.60b0",
    "opentelemetry-exporter-otlp-proto-grpc==1.39.0",
    "opentelemetry-exporter-otlp-proto-http==1.39.0",
    "nats-py==2.7.2",
    "netaddr==1.3.0",
    "authlib==1.6.6",
    "aiodataloader==0.4.3",
    "fast-depends==3.0.5",
    "cachetools-async==0.0.5",
    "puremagic>=1.30,<2",
    # Dependencies specific to the SDK
    "rich>=13,<14",
    "pyarrow>=14",
    "numpy>=1.26.2",
    "dulwich==0.22.7",
    "whenever==0.9.3",
    "netutils==1.12.0",
    "ariadne-codegen==0.15.3",
]

[project.urls]
Homepage = "https://opsmill.com"
Repository = "https://github.com/opsmill/infrahub"
Documentation = "https://docs.infrahub.app/"

[tool.uv.sources]
infrahub-server = { workspace = true }
infrahub-sdk = { path = "python_sdk", editable = true }
infrahub-testcontainers = { path = "python_testcontainers", editable = true }

[dependency-groups]
dev = [
    "yamllint",
    "mypy>=1.15,<1.16",
    "ipython>=8,<9",
    "pytest-asyncio>=1.3,<1.4",
    "pytest-clarity>=1.0,<1.1",
    "pytest-cov==7.0.0",
    "pytest-xdist>=3.4,<3.5",
    "types-python-slugify>=8.0.0.3,<9",
    "types-ujson",
    "types-pyyaml",
    "types-cachetools==6.2.0.20250827",
    "ruff==0.14.5",
    "invoke==2.2.0",
    "pytest-benchmark>=4.0.0,<5",
    "pytest-codspeed>=4.2.0,<5",
    "polyfactory==2.16.2",
    "towncrier>=24.8,<25",
    "pytest-env>=1.1.3,<2",
    "testcontainers==4.8.1",
    "pytest-timeout==2.3.1",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
    "semver>=3.0.2,<4",
    "ruamel-yaml==0.18.6",
    "pytest-httpx>=0.30",
    "docker==7.1.0",
    "psutil==6.1.0",
    "jwcrypto==1.5.6",
    "ty==0.0.14",
    "prek>=0.3.0",
]

# test-scale = [
# "locust==2.20.1",
# "docker==7.0.0",
# "matplotlib>=3.8,<4",
# "pandas>=2.2,<3",
# ]

[project.scripts]
infrahub = "infrahub.cli:app"
infrahub-git-credential = "infrahub.git_credential.helper:app"
infrahub-git-askpass = "infrahub.git_credential.askpass:app"
infrahubctl = "infrahub_sdk.ctl.cli:app"

[project.entry-points.pytest11]
"pytest-infrahub" = "infrahub_sdk.pytest_plugin.plugin"

[project.entry-points."prefect.collections"]
"infrahubasync" = "infrahub.workers.infrahub_async"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError()"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
timeout = 300 # 5 minutes
session_timeout = 1800 # 30 minutes
testpaths = ["tests"]
filterwarnings = [
    "ignore:Module already imported so cannot be rewritten",
    "ignore:Deprecated call to",
    "ignore:pkg_resources is deprecated as an API",          # Remove on https://github.com/open-telemetry/opentelemetry-python-contrib/pull/2181 has been fixed
]
addopts = "-v --cov-report term-missing --cov-report xml --dist loadscope --junitxml=pytest-junit.xml"
junit_duration_report = "call"

[tool.pytest_env]
PREFECT_LOGGING_LEVEL = "CRITICAL"
INFRAHUB_LOG_LEVEL = "CRITICAL"
INFRAHUB_PRODUCTION = false

[tool.mypy]
pretty = true
ignore_missing_imports = true
disallow_untyped_defs = true
disable_error_code = ["type-abstract"]
exclude = [
    "^backend/tests/fixtures/repos/*", # To avoid 'Duplicate module named "transforms"'
    "^backend/tests/scale",
    "^backend/tests/component",
    "^backend/tests/test_data/dataset03.py",
    "^backend/tests/query_benchmark"
]

[[tool.mypy.overrides]]
module = "infrahub.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.conftest"
disallow_untyped_defs = false

