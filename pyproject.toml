[tool.ruff]
line-length = 120
target-version = "py312"

exclude = [
    ".git",
    ".tox",
    ".venv",
    "env",
    "_build",
    "build",
    "dist",
    "examples",
]


[tool.ruff.lint]
preview = true

task-tags = ["FIXME", "TODO", "XXX"]

select = ["ALL"]

ignore = [
    "D",        # pydocstyle
    "DOC",      # pydoclint
    "CPY",      # flake8-copyright
    "T201",     # use of `print`
    "ISC",      # flake8-implicit-str-concat
    "COM812",   # missing-trailing-comma

    ##################################################################################################
    # Rules below needs to be Investigated                                                           #
    ##################################################################################################
    "EM",       # flake8-errmsg
    "TRY",      # tryceratops
    "FBT",      # flake8-boolean-trap
    "G",        # flake8-logging-format
    "RSE",      # flake8-raise
    "BLE",      # flake8-blind-except (BLE)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.params.Query",
    "typer.Argument",
]

#https://docs.astral.sh/ruff/formatter/black/
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-builtins]
ignorelist = [
    "id",
    # Review and update builtin shadowing below this line
    "filter",
    "format",
    "input",
    "property",
    "type",
]

[tool.ruff.lint.isort]
known-first-party = ["infrahub"]

[tool.ruff.lint.pycodestyle]
max-line-length = 150

[tool.ruff.lint.mccabe]
# Target max-complexity=10
max-complexity = 30

[tool.ruff.lint.pylint]

allow-dunder-method-names = [
    "__init_subclass_with_meta__", # Dunder method used within Graphene
]

[tool.ruff.lint.per-file-ignores]

"backend/infrahub/**.py" = [
    ##################################################################################################
    # Refactor code and remove the ignore rule
    ##################################################################################################
    "ANN003",   # Missing type annotation for `**kwargs`
    "ANN401",   # Dynamically typed expressions (typing.Any) are disallowed
    "ASYNC240", # Async functions should not use pathlib.Path methods
    "ERA001",   # Found commented-out code
    "FAST002",  # FastAPI dependency without `Annotated`
    "FIX",      # flake8-fixme
    "FURB113",  # Use `extend(...)` instead of repeatedly calling `append()`
    "INP001",   # File is part of an implicit namespace package
    "FURB118",  # Use `operator.itemgetter(1)` instead of defining a lambda
    "FURB140",  # Use `itertools.starmap` instead of the generator
    "FURB192",  # Prefer `min` over `sorted()` to compute the minimum value
    "N801",     # Class name should use CapWords convention
    "N806",     # Variable in function should be lowercase
    "PERF401",  # Use a list comprehension to create a transformed list
    "PERF403",  # Use a dictionary comprehension instead of a for-loop
    "PGH003",   # Use specific rule codes when ignoring type issues
    "PGH004",   # Use specific rule codes when using `noqa`
    "PLC0415",  # `import` should be at the top-level of a file
    "PLR0904",  # Too many public methods
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0914",  # Too many local variables
    "PLR0916",  # Too many Boolean expressions
    "PLR0917",  # Too many positional arguments
    "PLR2004",  # Magic value used in comparison
    "PLR6201",  # Use a `set` literal when testing for membership
    "PLR6301",  # Method could be a function, class method, or static method
    "PLW0603",  # Using the global statement is discouraged
    "PLW1514",  # `pathlib.Path(...).open` without explicit `encoding` argument
    "RET504",   # Unnecessary assignment before `return` statement
    "RUF005",   # Consider spread operator instead of concatenation
    "RUF010",   # Use explicit conversion flag
    "RUF012",   # Mutable class attributes should be annotated with `typing.ClassVar`
    "RUF029",   # Function is declared `async`, but doesn't `await`
    "RUF052",   # Local dummy variable is accessed
    "S101",     # Use of `assert` detected
    "S105",     # Possible hardcoded password
    "S311",     # Standard pseudo-random generators are not suitable for crypto
    "SIM102",   # Use a single `if` statement instead of nested `if` statements
    "SIM103",   # Return the condition directly
    "SIM108",   # Use ternary operator instead of `if`-`else`-block
    "SIM110",   # Use `return any(...)` instead of `for` loop
    "SIM113",   # Use `enumerate()` for index variable in `for` loop
    "SIM114",   # Combine `if` branches using logical `or` operator
    "SIM117",   # Use a single `with` statement with multiple contexts
    "SIM118",   # Use `key in dict` instead of `key in dict.keys()`
    "SLF001",   # Private member accessed
    "TD",       # flake8-todos
    "TID252",   # Replace relative imports from parent modules with absolute imports
    "UP031",    # Use format specifiers instead of percent format
    "UP035",    # `typing.List` is deprecated, use `list` instead
]

"backend/infrahub/cli/db.py" = [
