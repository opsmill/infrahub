---
# A generator definition targets a group defined as an object in this repository, and the
# objects section also declares the automation that references that generator definition: a
# generator action pointing at the generator, and a node trigger rule pointing at the action.
# On a first import against an empty graph the generator action can only resolve once the
# generator definition exists, so the objects must be reconciled around the definitions rather
# than strictly before them.
queries:
  - name: tags_query
    file_path: "tags_query.gql"

generator_definitions:
  - name: tags_generator
    file_path: "generators/tags_generator.py"
    targets: repo_defined_group
    query: tags_query
    execute_in_proposed_change: false
    execute_after_merge: false

objects:
  - objects/01_groups.yml
  - objects/99_triggers.yml
