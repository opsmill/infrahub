query PersonWithTheirCars($name: String!) {
  TestingPerson(name__value: $name) {
    edges {
      node {
        id
        __typename
        name {
          value
        }
        age {
          value
        }
        cars {
          edges {
            node {
              id
              __typename
              name {
                value
              }
            }
          }
        }
      }
    }
  }
}