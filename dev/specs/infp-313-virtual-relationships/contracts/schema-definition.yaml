---
# Schema Contract: Virtual Relationship Definition
#
# This defines the user-facing YAML schema format for virtual relationships.
# Virtual relationships are defined as a new top-level list on node/generic schemas.

# VirtualRelationshipSchema definition
virtual_relationship_schema:
  type: object
  required:
    - name
    - path
  properties:
    name:
      type: string
      pattern: "^[a-z][a-z0-9_]{2,63}$"
      description: >
        Unique name within the node. Must be lowercase, 3-64 chars.
        Must not conflict with attribute names or relationship names on the same node.
    label:
      type: string
      maxLength: 64
      description: >
        Human-friendly display label. Auto-generated from name if not provided.
    description:
      type: string
      maxLength: 128
      description: Short description of the virtual relationship.
    path:
      type: string
      pattern: "^[a-z][a-z0-9_]+(__[a-z][a-z0-9_]+)+$"
      description: >
        Double-underscore-separated traversal path. Each segment is a relationship
        name on the node kind at that position in the chain.
        Minimum 2 segments, maximum 10 segments.
        Example: "bays__line_cards__modules__interfaces"
    peer:
      type: string
      description: >
        Optional explicit peer kind. If provided, validated against the kind
        resolved from the path. If not provided, derived from path.
    order_weight:
      type: integer
      description: Frontend ordering (lowest first).

# Usage in node schema
node_schema_with_virtual_relationships:
  example:
    nodes:
      - name: Device
        namespace: Infra
        attributes:
          - name: hostname
            kind: Text
            unique: true
        relationships:
          - name: bays
            peer: InfraBay
            cardinality: many
            kind: Component
        virtual_relationships:
          - name: all_interfaces
            label: "All Interfaces"
            description: "All interfaces across all bays, line cards, and modules"
            path: bays__line_cards__modules__interfaces
          - name: affected_services
            label: "Affected Services"
            path: interfaces__circuits__containers__services

# Usage in schema extensions
extension_with_virtual_relationships:
  example:
    extensions:
      nodes:
        - kind: InfraDevice
          virtual_relationships:
            - name: all_interfaces
              path: bays__line_cards__modules__interfaces

# Validation errors
validation_errors:
  - code: VIRTUAL_REL_INVALID_PATH_SEGMENT
    message: >-
      Virtual relationship '{name}' on '{node_kind}': segment '{segment}'
      is not a valid relationship on '{current_kind}'
  - code: VIRTUAL_REL_PATH_TOO_SHORT
    message: "Virtual relationship '{name}' on '{node_kind}': path must have at least 2 segments"
  - code: VIRTUAL_REL_PATH_TOO_LONG
    message: "Virtual relationship '{name}' on '{node_kind}': path must have at most 10 segments"
  - code: VIRTUAL_REL_NAME_CONFLICT
    message: "Virtual relationship '{name}' on '{node_kind}': name conflicts with existing {conflict_type} '{name}'"
  - code: VIRTUAL_REL_CIRCULAR_PATH
    message: "Virtual relationship '{name}' on '{node_kind}': path creates circular reference through '{repeated_kind}'"
